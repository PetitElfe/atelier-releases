<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L’Atelier du Goblin — prototype mobile</title>
<style>
:root{font-family:system-ui,sans-serif;color:#443e31;background:#24372d}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#24372d;color:#f0e2c3;padding:15px 16px;display:flex;align-items:center;justify-content:space-between;z-index:2}header button{background:none;border:0;color:inherit;font-size:26px}header strong{font-family:Georgia,serif;font-size:19px}.paper{background:#f1e5c9;min-height:calc(100dvh - 70px);padding:24px 18px 70px;border-radius:20px 20px 0 0}h1,h2{font-family:Georgia,serif;color:#3d5a45}h1{text-align:center;font-size:28px;margin:4px 0 6px}h2{font-size:19px;margin:0 0 12px}.sub{text-align:center;color:#786e57;font-size:13px;margin-bottom:25px}.panel{background:#fff9eb;border:1px solid #d7c9a7;border-radius:15px;padding:17px;margin:14px 0}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e8dcc5}.item:last-child{border:0}.item input{accent-color:#547b5b;width:21px;height:21px}.item span{flex:1}.item.done span{text-decoration:line-through;color:#8d8a7d}textarea,input[type=text]{width:100%;background:#fffdf6;border:1px solid #c8ba9c;border-radius:10px;padding:12px;color:#443e31}textarea{min-height:90px}.action{background:#496a50;color:white;border:0;border-radius:10px;padding:11px 15px;margin-top:9px}.nav{position:fixed;z-index:5;inset:0 auto 0 0;width:min(82vw,310px);background:#263b30;color:#f3e6c8;padding:24px 18px;box-shadow:0 0 0 100vmax #0008}.nav button{display:block;width:100%;text-align:left;padding:14px;background:transparent;color:inherit;border:0;border-bottom:1px solid #ffffff25}.nav[hidden],[hidden]{display:none!important}.muted{font-size:13px;color:#81765f}.arrows{display:flex;gap:8px}.arrows button{border:1px solid #cfc09f;border-radius:8px;background:#f1e5c9;padding:5px 9px}.footer{text-align:center;font-size:12px;color:#8b816b;margin-top:30px}
</style></head><body>
<header><button id="menu" aria-label="Ouvrir le menu">☰</button><strong>L’Atelier du Goblin</strong><span aria-hidden="true">🌿</span></header>
<nav class="nav" id="nav" hidden><button id="close">✕ Fermer</button><button data-page="journal">📖 Mon journal</button><button data-page="tasks">☑ Mes tâches</button><button data-page="shopping">🧺 Mes courses</button><button data-page="calendar">▦ Calendrier</button><button data-page="settings">⚙ Personnaliser</button></nav>
<main class="paper"><h1 id="title">Mon journal</h1><p class="sub" id="subtitle">Chaque petite chose a sa place.</p><div id="content"></div><p class="footer">Prototype mobile local • aucune synchronisation active</p></main>
<script>
const KEY='goblin-mobile-prototype-v1';
const defaults={page:'journal',sections:['habits','tasks','notes','shopping'],visible:{habits:true,tasks:true,notes:true,shopping:false},habits:[{text:'Prendre un moment pour moi',done:false},{text:'Boire de l’eau',done:false}],tasks:[],shopping:[],notes:[]};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)}
const names={habits:'Mes habitudes',tasks:'Mes tâches',notes:'Mes pensées',shopping:'Mes courses'};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const el=(tag,attrs={},text='')=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else n.setAttribute(k,v)}n.textContent=text;return n};
function list(parent,kind){const rows=state[kind];rows.forEach((entry,i)=>{const line=el('label',{class:'item'+(entry.done?' done':'')});const cb=el('input',{type:'checkbox'});cb.checked=!!entry.done;cb.onchange=()=>{entry.done=cb.checked;save();render()};line.append(cb,el('span',{},entry.text));parent.append(line)});const input=el('input',{type:'text',placeholder:kind==='shopping'?'Ajouter une course…':'Ajouter un élément…'});const btn=el('button',{class:'action'},'Ajouter');btn.onclick=()=>{if(input.value.trim()){rows.push({text:input.value.trim(),done:false});save();render()}};parent.append(input,btn)}
function panel(parent,title){const p=el('section',{class:'panel'});p.append(el('h2',{},title));parent.append(p);return p}
function render(){const root=document.getElementById('content');root.replaceChildren();const page=state.page;document.getElementById('title').textContent={journal:'Mon journal',tasks:'Mes tâches',shopping:'Mes courses',calendar:'Calendrier',settings:'Personnaliser'}[page];document.getElementById('subtitle').textContent=page==='journal'?'Chaque petite chose a sa place.':'Mon petit espace tranquille 🌿';
if(page==='journal'){state.sections.filter(k=>state.visible[k]).forEach(k=>section(root,k))}
else if(page==='tasks'||page==='shopping')section(root,page);
else if(page==='calendar'){panel(root,'Mes rendez-vous').append(el('p',{class:'muted'},'Le calendrier connecté à ton Atelier arrivera dans une prochaine étape.'))}
else if(page==='settings'){const update=panel(root,'Mises à jour');const status=el('p',{class:'muted',id:'update-status'},window.lastUpdateMessage||'Vérifier les nouvelles versions de l’application.');const check=el('button',{class:'action'},'Vérifier les mises à jour');check.onclick=()=>{status.textContent='Recherche en cours…';if(window.AtelierUpdates)window.AtelierUpdates.check();else status.textContent='Vérification disponible uniquement dans l’application Android.'};update.append(status,check);if(window.availableUpdateUrl){const download=el('button',{class:'action'},'Télécharger la mise à jour');download.onclick=()=>window.AtelierUpdates&&window.AtelierUpdates.download(window.availableUpdateUrl);update.append(download)}const p=panel(root,'Choisir mes sections');state.sections.forEach((k,i)=>{const row=el('div',{class:'item'});const cb=el('input',{type:'checkbox'});cb.checked=!!state.visible[k];cb.onchange=()=>{state.visible[k]=cb.checked;save()};row.append(cb,el('span',{},names[k]));const arrows=el('div',{class:'arrows'});for(const [symbol,offset] of [['↑',-1],['↓',1]]){const b=el('button',{},symbol);b.disabled=i+offset<0||i+offset>=state.sections.length;b.onclick=()=>{[state.sections[i],state.sections[i+offset]]=[state.sections[i+offset],state.sections[i]];save();render()};arrows.append(b)}row.append(arrows);p.append(row)})}}
function section(root,k){const p=panel(root,names[k]);if(k==='notes'){const ta=el('textarea',{placeholder:'Une pensée à garder…'});const btn=el('button',{class:'action'},'Conserver ma note');btn.onclick=()=>{if(ta.value.trim()){state.notes.unshift(ta.value.trim());save();render()}};p.append(ta,btn);state.notes.slice(0,5).forEach(n=>p.append(el('p',{},n)))}
else list(p,k)}
document.getElementById('menu').onclick=()=>document.getElementById('nav').hidden=false;
document.getElementById('close').onclick=()=>document.getElementById('nav').hidden=true;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();document.getElementById('nav').hidden=true;render()});
window.onAtelierUpdate=(message,url)=>{window.lastUpdateMessage=message;window.availableUpdateUrl=url;const p=document.getElementById('update-status');if(p)p.textContent=message;if(state.page==='settings')render()};
render();
</script></body></html>
