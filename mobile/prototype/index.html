tton{border:1px solid var(--card-border);border-radius:9px;background:var(--field-bg);color:var(--ink);font:600 13px system-ui;padding:8px 10px}.goblin-update-banner button:focus-visible{outline:2px solid var(--accent)}
/* The PC companion sections must fit the narrow Android screen: no horizontal overflow. */

<script>
/* Capture existing 0.1.5 WebView localStorage before the new app reads or edits it.
   Snapshots live in Android app-private files, never in a remote service. */
function goblinSnapshot(reason='manual'){
 try{
  if(!window.AtelierAutoBackup?.snapshot)return false;
  const entries=Object.create(null);
  for(let i=0;i<localStorage.length;i++){
   const key=localStorage.key(i);
   if(key!==null)entries[key]=localStorage.getItem(key);
  }
  if(!Object.keys(entries).length)return false;
  return !!window.AtelierAutoBackup.snapshot(JSON.stringify({
   format:'goblin-localstorage-v1',savedAt:new Date().toISOString(),entries
  }),reason);
 }catch(e){return false}
}
const goblinFirstBackupOkay=goblinSnapshot('startup');
function goblinRestoreBackup(raw){
 let parsed;
 try{parsed=JSON.parse(raw)}catch(e){alert('Sauvegarde illisible. Rien n’a été modifié.');return}
 const entries=parsed?.format==='goblin-localstorage-v1'?parsed.entries:
  parsed?.format==='atelier-goblin-android-backup-v2'?parsed.allLocalStorage:null;
 if(!entries||typeof entries!=='object'||Array.isArray(entries)||!Object.keys(entries).length||
   !Object.entries(entries).every(([k,v])=>typeof k==='string'&&typeof v==='string')){
  alert('Format de sauvegarde incompatible. Rien n’a été modifié.');return;
 }
 if(!confirm('Restaurer cette sauvegarde ? Les valeurs enregistrées remplaceront celles du téléphone pour les mêmes rubriques.'))return;
 if(!goblinSnapshot('pre-restore')){
  alert('Impossible de sauvegarder les données actuelles avant restauration. Opération annulée.');return;
 }
 try{
  for(const [key,value] of Object.entries(entries))localStorage.setItem(key,value);
  location.reload();
 }catch(e){alert('Restauration incomplète. Restaure la sauvegarde de sécurité depuis Paramètres.')}
}
const KEY='goblin-mobile-prototype-v1';
const defaults={page:'journal',sections:['habits','tasks','notes','shopping'],visible:{habits:true,tasks:true,notes:true,shopping:false},habits:[{text:'Prendre un moment pour moi',done:false},{text:'Boire de l’eau',done:false}],tasks:[],shopping:[],notes:[],events:[]};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)}
const names={habits:'Mes habitudes',tasks:'Mes tâches',notes:'Mes pensées',shopping:'Mes courses'};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
if(!Array.isArray(state.events))state.events=[];
const el=(tag,attrs={},text='')=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else n.setAttribute(k,v)}n.textContent=text;return n};
function list(parent,kind){const rows=state[kind];rows.forEach((entry,i)=>{const line=el('label',{class:'item'+(entry.done?' done':'')});const cb=el('input',{type:'checkbox'});cb.checked=!!entry.done;cb.onchange=()=>{entry.done=cb.checked;save();render()};line.append(cb,el('span',{},entry.text));parent.append(line)});const input=el('input',{type:'text',placeholder:kind==='shopping'?'Ajouter une course…':'Ajouter un élément…'});const btn=el('button',{class:'action'},'Ajouter');btn.onclick=()=>{if(input.value.trim()){rows.push({text:input.value.trim(),done:false});save();render()}};parent.append(input,btn)}
function panel(parent,title){const p=el('section',{class:'panel'});p.append(el('h2',{},title));parent.append(p);return p}
function render(){const root=document.getElementById('content');root.replaceChildren();const page=state.page;document.getElementById('title').textContent={journal:'Mon journal',tasks:'Mes tâches',shopping:'Mes courses',calendar:'Calendrier',capture:'Note rapide',settings:'Paramètres'}[page];document.getElementById('subtitle').textContent=page==='journal'?'Chaque petite chose a sa place.':'Mon petit espace tranquille 🌿';
if(page==='journal'){state.sections.filter(k=>state.visible[k]).forEach(k=>section(root,k))}
else if(page==='tasks'||page==='shopping')section(root,page);

async function syncPull({quiet=false}={}){

  const result=await Promise.allSettled(paths.map(path=>callPc('GET',path)));

  const unavailable=[];
  let valid=0;
  result.forEach((r,i)=>{
   if(r.status==='fulfilled'&&Array.isArray(r.value)){pc[keys[i]]=r.value;valid++}
   else unavailable.push(keys[i]);

/* The user selected the ACTUAL Freesound "Beast miam miam comedy sound",
   not a synthesized bell and not a text-to-speech impersonation.
   It must be imported once and stored as a Blob, never as 5MB+ localStorage.
   The clip is CC0: freesound.org/people/Piement_infernal/sounds/772687/ */
const MIAM_DB='goblin-kitchen-miam-audio-v1', MIAM_KEY='beast-miam-miam';
function kitchenAudioDatabase(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(new Error('Le stockage audio de ce téléphone est indisponible.'));return}
  const request=indexedDB.open(MIAM_DB,1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('sounds'))request.result.createObjectStore('sounds')};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('Stockage audio inaccessible'));
 });
}
async function kitchenStoredMiam(){
 const db=await kitchenAudioDatabase();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('sounds','readonly'),request=tx.objectStore('sounds').get(MIAM_KEY);
  request.onsuccess=()=>resolve(request.result||null);
  request.onerror=()=>reject(request.error||new Error('Lecture audio impossible'));
  tx.oncomplete=()=>db.close();
  tx.onabort=()=>{db.close();reject(tx.error||new Error('Lecture interrompue'))};
 });
}
async function kitchenImportMiam(file){
 if(!file)throw new Error('Choisis le fichier Beast Miam Miam.');
 if(file.size>12*1024*1024)throw new Error('Fichier trop lourd (12 Mo maximum).');
 if(!(/\.(wav|mp3|ogg|m4a)$/i.test(file.name)||String(file.type).startsWith('audio/')))throw new Error('Choisis un fichier audio WAV, MP3, OGG ou M4A.');
 const db=await kitchenAudioDatabase();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('sounds','readwrite');
  tx.objectStore('sounds').put({name:file.name,blob:file},MIAM_KEY);
  tx.oncomplete=()=>{db.close();resolve(file.name)};
  tx.onerror=()=>{db.close();reject(tx.error||new Error('Import audio impossible'))};
  tx.onabort=()=>{db.close();reject(tx.error||new Error('Import audio interrompu'))};
 });
}
function kitchenStopMiam(){
 if(!kitchenClipAudio)return;
 try{kitchenClipAudio.pause();kitchenClipAudio.currentTime=0;kitchenClipAudio.dispatchEvent(new Event('ended'))}catch(e){}
 kitchenClipAudio=null;
}
async function kitchenPlayMiam(force=false){
 if(!force&&!kitchenSoundEnabled)return false;
 let clip;
 try{clip=await kitchenStoredMiam()}catch(error){console.warn('[Goblin] Fichier Miam Miam non accessible',error);return false}
 if(!clip||!clip.blob)return false;
 kitchenStopMiam();
 const url=URL.createObjectURL(clip.blob),audio=new Audio(url);
 kitchenClipAudio=audio;audio.volume=1;audio.preload='auto';
 let cleaned=false;
 const cleanup=()=>{
  if(cleaned)return;
  cleaned=true;
  URL.revokeObjectURL(url);
  if(kitchenClipAudio===audio)kitchenClipAudio=null;
 };
 audio.addEventListener('ended',cleanup,{once:true});
 audio.addEventListener('error',cleanup,{once:true});
 try{await audio.play();return true}
 catch(error){console.warn('[Goblin] Lecture Beast Miam Miam refusée',error);cleanup();return false}
}

/* Explicit two-way synchronization. Tombstones preserve intentional deletions. */
const mentalBaseKey='goblin-mobile-mental-sync-base-v1';
let mentalSyncBase={};try{mentalSyncBase=JSON.parse(localStorage.getItem(mentalBaseKey)||'{}')||{}}catch(e){}
function mentalFingerprint(obj){
 const {updatedAt,createdAt,...rest}=obj;return JSON.stringify(rest)
}
function mentalMerge(local,remote){
 const result={cards:[],answers:[],journal:[],phrases:[]};
 for(const kind of ['cards','answers','journal','phrases']){
  const L=new Map((Array.isArray(local?.[kind])?local[kind]:[]).filter(x=>x&&typeof x.id==='string').map(x=>[x.id,x]));
  const R=new Map((Array.isArray(remote?.[kind])?remote[kind]:[]).filter(x=>x&&typeof x.id==='string').map(x=>[x.id,x]));
  const merged=new Map();const baseline=mentalSyncBase[kind]||{};
  for(const id of new Set([...L.keys(),...R.keys()])){
   const left=L.get(id),right=R.get(id);
   if(!left||!right){merged.set(id,left||right);continue}
   const winner=left.updatedAt>=right.updatedAt?left:right,loser=winner===left?right:left;
   if(mentalFingerprint(left)!==mentalFingerprint(right)){
    const last=baseline[id];
    if(last && (left.updatedAt===last)!==(right.updatedAt===last)){
      // Only one device edited this record after last sync.
      merged.set(id,left.updatedAt===last?right:left);continue
    }
    if(!winner.deletedAt&&!loser.deletedAt){
      // Both devices edited: preserve the prior text as a clearly marked copy.
      let h=0;for(const c of JSON.stringify(loser)){h=((h*31)+c.charCodeAt(0))|0}
      const copyId='history-'+id.slice(0,50)+'-'+(h>>>0).toString(36);
      const copy={...loser,id:copyId,updatedAt:loser.updatedAt,
        ...(kind==='cards'||kind==='journal'?{title:(loser.title||'Sans titre')+' (ancienne version)'}:
        kind==='answers'?{text:loser.text+'\n(Ancienne version conservée après conflit)'}:
        {text:loser.text+' (ancienne version)'})};
      if(!L.has(copyId)&&!R.has(copyId))merged.set(copyId,copy);
    }
   }
   merged.set(id,winner);
  }
  result[kind]=[...merged.values()].filter(x=>x&&typeof x.updatedAt==='string').sort((x,y)=>y.updatedAt.localeCompare(x.updatedAt));
 }
 return result;
}
function mentalSetSyncBase(data){
 mentalSyncBase={};
 for(const kind of ['cards','answers','journal','phrases'])mentalSyncBase[kind]=Object.fromEntries((data[kind]||[]).map(x=>[x.id,x.updatedAt]));
 localStorage.setItem(mentalBaseKey,JSON.stringify(mentalSyncBase))
}
async function mentalSyncNow(status,button){
 if(mentalSyncBusy)return;
 if(!pcUrl){status.textContent='Connecte d’abord ton ordinateur dans Paramètres > Connexion au PC.';return}
 mentalSyncBusy=true;button.disabled=true;status.textContent='Synchronisation privée en cours…';
 try{
  for(let attempt=0;attempt<3;attempt++){
   const response=await callPc('GET','/api/mobile/mental');
   if(!response||!Number.isInteger(Number(response.rev))||!response.data)throw Error('Réponse PC inattendue.');
   // Isolate the request from edits made while the native network call is pending.
   const sentLocal=JSON.parse(JSON.stringify(mentalData));
   const joined=mentalMerge(sentLocal,response.data);
   const uploaded=await callPc('POST','/api/mobile/mental',{rev:Number(response.rev),data:{version:1,...joined}}).catch(error=>{
    if(String(error).includes('Conflit')||String(error).includes('modifié ailleurs'))return {conflict:true};
    throw error;
   });
   if(uploaded?.conflict)continue;
   // Reapply only edits made since this request started, including deletions.
   // The sync baseline remains the acknowledged payload, never unsent edits.
   let pending=false;
   const preserved={...joined};
   for(const kind of ['cards','answers','journal','phrases']){
    const before=new Map(sentLocal[kind].map(x=>[x.id,x]));
    const live=new Map(mentalData[kind].map(x=>[x.id,x]));
    const records=new Map(joined[kind].map(x=>[x.id,x]));
    for(const id of new Set([...before.keys(),...live.keys()])){
     if(JSON.stringify(before.get(id))===JSON.stringify(live.get(id)))continue;
     pending=true;
     if(live.has(id))records.set(id,live.get(id));else records.delete(id);
    }
    preserved[kind]=[...records.values()].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
   }
   mentalData=preserved;mentalSave();mentalSetSyncBase(joined);
   status.textContent=pending?'Envoi terminé. Tes dernières modifications sont conservées sur ce téléphone ; synchronise à nouveau pour les envoyer au PC.':'Carnet synchronisé avec ton PC. Les réponses sont conservées.';
   return;
  }
  status.textContent='Le carnet a changé sur un autre appareil. Réessaie sans effacer tes notes.';
 }catch(error){status.textContent='Synchronisation impossible : '+String(error.message||error).slice(0,190)+' — données locales conservées.'}
 finally{mentalSyncBusy=false;button.disabled=false}
}
function mentalView(root){
 if(mentalBreath){mentalBreathing(root);return}
 mentalBook(root);
 root.append(el('p',{class:'muted'},'Les réponses restent sur ton téléphone tant que tu ne synchronises pas volontairement avec ton PC. Tu peux modifier, supprimer ou exporter tes écrits.'));
 const bar=el('div',{class:'mental-section-grid'});
 for(const [id,label] of mentalSections){const b=el('button',{type:'button','aria-pressed':String(mentalCategory===id)},label);b.onclick=()=>{mentalCategory=id;render()};bar.append(b)}
 const journal=el('button',{type:'button','aria-pressed':String(mentalCategory==='journal')},'Mon journal libre');journal.onclick=()=>{mentalCategory='journal';render()};bar.append(journal);root.append(bar);
 const soft=panel(root,'Mes petites phrases à penser');
 const phraseInput=el('input',{type:'text',placeholder:'Une petite phrase douce…'});
 const phraseAdd=el('button',{type:'button',class:'action'},'Ajouter cette phrase');
 phraseAdd.onclick=()=>{if(!phraseInput.value.trim())return;mentalData.phrases.push({id:mentalId(),text:phraseInput.value.trim().slice(0,250),createdAt:mentalStamp(),updatedAt:mentalStamp()});mentalSave();mentalRefresh()};
 soft.append(phraseInput,phraseAdd);
 for(const line of mentalData.phrases.filter(x=>!x.deletedAt)){
  const row=el('div',{class:'mental-card'});row.append(el('p',{},line.text));
  const edit=el('button',{type:'button',class:'action'},'Modifier'),del=el('button',{type:'button',class:'action'},'Supprimer');
  edit.onclick=()=>{const v=prompt('Ma phrase douce',line.text);if(v===null)return;line.text=v.trim().slice(0,250);line.updatedAt=mentalStamp();mentalSave();mentalRefresh()};
  del.onclick=()=>{line.deletedAt=mentalStamp();line.updatedAt=line.deletedAt;mentalSave();mentalRefresh()};
  row.append(edit,del);soft.append(row)
 }
 const syncRow=panel(root,'Retrouver mon carnet sur PC');
 const syncButton=el('button',{type:'button',class:'action'},'Synchroniser maintenant avec mon PC');
 const syncStatus=el('p',{class:'mental-muted'},'Synchronisation volontaire uniquement. Les données personnelles ne partent pas sans ton action.');
 syncButton.onclick=()=>mentalSyncNow(syncStatus,syncButton);syncRow.append(syncButton,syncStatus);
 const breath=el('button',{class:'action'},'Respiration douce');breath.onclick=()=>{mentalBreath=true;render()};root.append(breath);
 mentalEntries(root,mentalCategory);
 const back=el('button',{class:'action'},'Revenir à mes outils');back.onclick=()=>{mentalStop();state.page='tools';save();render()};root.append(back)
}
const previousMentalRender=render;
render=function(){
 if(state.page==='mental'){document.getElementById('title').textContent='Mes moments doux';document.getElementById('subtitle').textContent='Un endroit pour me retrouver, sans obligation.';const root=document.getElementById('content');root.replaceChildren();mentalView(root);updateNav();return}
 previousMentalRender();
 if(state.page==='tools'){
   const root=document.getElementById('content');
   const btn=el('button',{class:'action',type:'button'},'Ouvrir mes moments doux');
   btn.onclick=()=>mentalGo('anxiety');root.prepend(btn);
 }
};
const goblinStar=document.querySelector('.star-tab');
/* Star swipe: follow the finger, spring home, and open breathing only above threshold.
   Pointer events work for touch, stylus and mouse; the ordinary tap stays usable. */
let starPointer=null,starStartY=0,starTravel=0,starSuppressClick=false;
goblinStar.style.touchAction='none';
goblinStar.addEventListener('pointerdown',e=>{
 if(starPointer!==null||!e.isPrimary)return;
 starPointer=e.pointerId;starStartY=e.clientY;starTravel=0;
 goblinStar.style.transition='none';
 goblinStar.setPointerCapture(e.pointerId);
});
goblinStar.addEventListener('pointermove',e=>{
 if(e.pointerId!==starPointer)return;
 starTravel=Math.max(0,Math.min(95,starStartY-e.clientY));
 goblinStar.style.transform='translateY(-'+starTravel+'px)';
 goblinStar.setAttribute('aria-label',starTravel>=55?'Relâcher pour ouvrir la respiration':'Glisser vers le haut pour respirer');
});
function starRelease(e){
 if(e.pointerId!==starPointer)return;
 // Pointer-up can arrive without a final pointer-move on some Android WebViews.
 const completed=e.type==='pointerup'&&Math.max(starTravel,Math.max(0,starStartY-e.clientY))>=55;
 starPointer=null;starTravel=0;
 goblinStar.style.transition='transform .28s cubic-bezier(.2,.8,.2,1)';
 goblinStar.style.transform='translateY(0)';
 goblinStar.setAttribute('aria-label','Mes outils apaisement. Glisser vers le haut pour respirer');
 if(completed){
  starSuppressClick=true;
  mentalGo('anxiety',true);
 }else if(e.type==='pointerup'&&starStartY-e.clientY>8){
  starSuppressClick=true;
 }
}
goblinStar.addEventListener('pointerup',starRelease);
goblinStar.addEventListener('pointercancel',starRelease);
goblinStar.addEventListener('lostpointercapture',starRelease);
goblinStar.addEventListener('click',e=>{
 if(!starSuppressClick)return;
 starSuppressClick=false;e.stopImmediatePropagation();e.preventDefault();
},true);
// Reset even if Android did not emit a synthetic click after the swipe.
goblinStar.addEventListener('pointerdown',()=>{if(starSuppressClick){starSuppressClick=false}},true);

  document.getElementById('subtitle').textContent='Mes textes rangés automatiquement par #hashtag.';

function goHome(){
 document.getElementById('nav').hidden=true;
 jdrEdit=null;
 state.page='journal';save();render();window.scrollTo(0,0);
}
document.getElementById('home').onclick=goHome;
document.getElementById('quickSettings').onclick=()=>{state.page='settings';save();render();window.scrollTo(0,0)};
document.getElementById('openGoblinUpdate').onclick=()=>{state.page='settings';save();render();window.scrollTo(0,0)};
document.getElementById('dismissGoblinUpdate').onclick=()=>{
 const version=goblinUpdate.version||localStorage.getItem('goblin-update-available-v1')||'';
 sessionStorage.setItem('goblin-update-banner-dismissed',version);
 updateUi();
};
window.__atelierHandleAndroidBack=function(){
 if(!document.getElementById('nav').hidden){document.getElementById('nav').hidden=true;return 'handled'}
 if(jdrEdit){jdrEdit=null;render();return 'handled'}
 if(state.page!=='journal'){goHome();return 'handled'}
 return 'exit';
};

if(pcUrl)syncPull();
updateUi();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')goblinSnapshot('background')});
