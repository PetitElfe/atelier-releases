<style>
:root{font-family:system-ui,sans-serif;color:#443e31;background:#24372d}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#24372d;color:#f0e2c3;padding:calc(15px + env(safe-area-inset-top, 0px)) 16px 15px;display:flex;align-items:center;justify-content:space-between;z-index:2}header button{background:none;border:0;color:inherit;font-size:26px}header strong{font-family:Georgia,serif;font-size:19px}.paper{background:#f1e5c9;min-height:calc(100dvh - 70px);padding:24px 18px 70px;border-radius:20px 20px 0 0}h1,h2{font-family:Georgia,serif;color:#3d5a45}h1{text-align:center;font-size:28px;margin:4px 0 6px}h2{font-size:19px;margin:0 0 12px}.sub{text-align:center;color:#786e57;font-size:13px;margin-bottom:25px}.panel{background:#fff9eb;border:1px solid #d7c9a7;border-radius:15px;padding:17px;margin:14px 0}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e8dcc5}.item:last-child{border:0}.item input{accent-color:#547b5b;width:21px;height:21px}.item span{flex:1}.item.done span{text-decoration:line-through;color:#8d8a7d}textarea,input[type=text]{width:100%;background:#fffdf6;border:1px solid #c8ba9c;border-radius:10px;padding:12px;color:#443e31}textarea{min-height:90px}.action{background:#496a50;color:white;border:0;border-radius:10px;padding:11px 15px;margin-top:9px}.nav{position:fixed;z-index:5;inset:0 auto 0 0;width:min(82vw,310px);background:#263b30;color:#f3e6c8;padding:calc(24px + env(safe-area-inset-top, 0px)) 18px 24px;box-shadow:0 0 0 100vmax #0008}.nav button{display:block;width:100%;text-align:left;padding:14px;background:transparent;color:inherit;border:0;border-bottom:1px solid #ffffff25}.nav[hidden],[hidden]{display:none!important}.muted{font-size:13px;color:#81765f}.arrows{display:flex;gap:8px}.arrows button{border:1px solid #cfc09f;border-radius:8px;background:#f1e5c9;padding:5px 9px}.footer{text-align:center;font-size:12px;color:#8b816b;margin-top:30px}select,input[type=date]{width:100%;background:#fffdf6;border:1px solid #c8ba9c;border-radius:10px;padding:12px;color:#443e31;margin:5px 0}

/* Mobile Goblin redesign: preserves existing localStorage and old pages. */
:root{--page-bg:#17231e;--header-bg:#192b22;--paper-bg:#202e26;--card-bg:#2a3b2f;--card-border:#5e755f;--ink:#f1ebd8;--muted-ink:#b7c8b3;--accent:#9ebc86;--field-bg:#1d2b23;--field-border:#6b866e;--tab-bg:#1b2c23;--tab-color:#d8e5ce}
body{background:var(--page-bg);color:var(--ink)}
header{background:var(--header-bg);color:var(--ink);border-bottom:1px solid var(--card-border)}
.paper{background:var(--paper-bg);color:var(--ink);padding-bottom:calc(115px + env(safe-area-inset-bottom,0px));min-height:100dvh;border-radius:19px 19px 0 0}
h1,h2{color:var(--accent)}.sub,.muted,.footer{color:var(--muted-ink)}
.panel{background:var(--card-bg);border-color:var(--card-border);box-shadow:0 6px 20px #0a160d24}
.item{border-color:var(--card-border)}
.item.done span{color:var(--muted-ink)}
textarea,input[type=text],select,input[type=date],input[type=time]{background:var(--field-bg);border:1px solid var(--field-border);color:var(--ink)}
.action{background:#577e5e;color:#fff}
.arrows button{border:1px solid var(--card-border);background:var(--field-bg);color:var(--ink)}
.nav{background:var(--header-bg);color:var(--ink)}
.mobile-tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;background:var(--tab-bg);color:var(--tab-color);display:flex;align-items:center;justify-content:space-around;padding:9px 6px calc(9px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--card-border);box-shadow:0 -8px 25px #0004}
.mobile-tabs button{border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:3px;padding:4px 2px;min-width:55px}
.mobile-tabs button.active{color:var(--accent);font-weight:800}
.mobile-tabs .tab-icon{font-size:23px;line-height:27px}
.mobile-tabs .star-tab{background:#416748;color:#fff;width:60px;height:60px;border:4px solid var(--tab-bg);border-radius:50%;margin-top:-26px;min-width:60px;box-shadow:0 5px 16px #0007;justify-content:center}
.mobile-tabs .star-tab .tab-icon{font-size:30px}
.tool-card{background:var(--field-bg);padding:13px;border-radius:13px;border:1px solid var(--card-border);margin:11px 0}
.tool-card h3{font-size:16px;margin:0 0 7px;color:var(--accent)}
.tool-card p{line-height:1.5}
.tool-card .action{margin:4px 4px 5px 0}
.theme-choice{display:flex;flex-direction:column;gap:8px}.theme-choice label{display:flex;align-items:center;gap:8px}.theme-choice input{accent-color:#81a986}
body.theme-classic{--page-bg:#24372d;--header-bg:#24372d;--paper-bg:#f1e5c9;--card-bg:#fff9eb;--card-border:#d7c9a7;--ink:#443e31;--muted-ink:#786e57;--accent:#3d5a45;--field-bg:#fffdf6;--field-border:#c8ba9c;--tab-bg:#f1e5c9;--tab-color:#3d5a45}
body.theme-classic header{color:#f0e2c3}
body.theme-classic .nav{color:#f0e2c3}
body.theme-classic .star-tab{color:#fff}
header .header-home{font:700 clamp(16px,4.3vw,22px) Georgia,serif;max-width:74vw;text-align:center;white-space:normal;padding:6px 3px;border-radius:9px}
header .header-home:focus-visible{outline:2px solid var(--accent)}
.jdr-tags{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.jdr-tag{background:var(--field-bg);border:1px solid var(--card-border);border-radius:20px;color:var(--ink);padding:7px 10px;font-size:13px}
.jdr-tag.selected{background:#51785a;color:white}
.jdr-item{border-top:1px solid var(--card-border);padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.jdr-item h3{font-size:16px;margin:0 0 8px;color:var(--accent)}
.jdr-item .action{margin-right:6px}
.jdr-hint{font-size:13px;line-height:1.5;color:var(--muted-ink)}
@media(min-width:680px){.paper{max-width:640px;margin:auto}.mobile-tabs{justify-content:center;gap:50px}}
.settings-group{margin:0 0 24px}.settings-group>h2{font:700 16px system-ui;color:var(--muted-ink);padding:12px 5px 0}.settings-group .panel{margin:9px 0;padding:18px}.settings-group .action{display:block;width:100%;min-height:48px;margin:12px 0 0;white-space:normal;text-align:center}.settings-group .arrows button{min-width:40px;min-height:40px}.mobile-tabs .tab-icon{display:flex;align-items:center;justify-content:center;height:28px}.mobile-tabs .tab-icon svg{width:25px;height:25px}.mobile-tabs .star-tab .tab-icon svg{width:31px;height:31px}.quick-settings{position:relative;display:flex;align-items:center;justify-content:center;width:42px;height:42px;flex-shrink:0}.quick-settings svg{width:25px;height:25px}.settings-badge{position:absolute;top:0;right:-3px;background:#ba5148;color:#fff;border-radius:12px;font:700 11px system-ui;padding:2px 6px}.drawer{overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}.drawer button{display:flex;align-items:center;gap:13px;min-height:53px;padding:12px 10px;border-bottom:1px solid #ffffff20;border-radius:8px;font:500 15px system-ui}.drawer button:focus-visible{outline:2px solid var(--accent)}.drawer .drawer-icon{display:flex;align-items:center;justify-content:center;width:23px;height:23px;min-width:23px;color:#bad1b6}.drawer .drawer-icon svg{width:23px;height:23px}.drawer .drawer-title{font:700 12px system-ui;letter-spacing:.06em;text-transform:uppercase;color:#aec4a9;padding:20px 9px 7px}.drawer-close-mark{font-size:25px;line-height:1;width:23px;text-align:center}.drawer-update-badge{margin-left:auto;border-radius:14px;min-width:23px;padding:4px 7px;background:#b84e45;color:#fff;font-size:12px;text-align:center}.goblin-update-banner{position:sticky;top:0;z-index:3;background:var(--card-bg);color:var(--ink);border-bottom:1px solid var(--accent);padding:10px 13px;display:flex;gap:9px;align-items:center;font:500 13px system-ui}.goblin-update-banner>span{flex:1}.goblin-update-banner button{border:1px solid var(--card-border);border-radius:9px;background:var(--field-bg);color:var(--ink);font:600 13px system-ui;padding:8px 10px}.goblin-update-banner button:focus-visible{outline:2px solid var(--accent)}</style></head><body>
<header><button id="menu" aria-label="Ouvrir le menu">☰<span id="goblinUpdateDot" hidden aria-label="Mise à jour disponible" style="color:#e5d48f;font-size:14px"> ●</span></button><button type="button" class="header-home" id="home" aria-label="Revenir à mon journal">L’Atelier du Goblin</button><button id="quickSettings" type="button" class="quick-settings" aria-label="Ouvrir les paramètres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 3h4.8l.6 2.5 1.6.9 2.5-.8 2.4 4.2-1.9 1.7v1.8l1.9 1.7-2.4 4.2-2.5-.8-1.6.9-.6 2.5H9.6L9 19.3l-1.6-.9-2.5.8-2.4-4.2 1.9-1.7v-1.8l-1.9-1.7 2.4-4.2 2.5.8L9 5.5 9.6 3Z"/><circle cx="12" cy="12" r="3"/></svg><span id="headerUpdateBadge" class="settings-badge" hidden>1</span></button></header>

<main class="paper"><h1 id="title">Mon journal</h1><p class="sub" id="subtitle">Chaque petite chose a sa place.</p><div id="content"></div><p class="footer">Glisse à gauche ou à droite pour changer de page • données locales conservées</p></main>

<button type="button" class="star-tab" data-mobile-go="tools" aria-label="Mes outils apaisement"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3 6.5 7 1-5 5 1 7-6-3.4-6 3.4 1-7-5-5 7-1L12 2Z"/></svg></span></button>
<button type="button" data-mobile-go="connected" data-mobile-section="shopping"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 10 4-7M19 10l-4-7M3 10h18l-2 10H5L3 10Z"/><path d="M9 13v4M15 13v4"/></svg></span>Courses</button>
<button type="button" data-mobile-go="connected" data-mobile-section="tasks"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="m8 13 3 3 5-6"/></svg></span>To-Do</button>
</nav>
<script>
const KEY='goblin-mobile-prototype-v1';
const defaults={page:'journal',sections:['habits','tasks','notes','shopping'],visible:{habits:true,tasks:true,notes:true,shopping:false},habits:[{text:'Prendre un moment pour moi',done:false},{text:'Boire de l’eau',done:false}],tasks:[],shopping:[],notes:[],events:[]};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)}
const names={habits:'Mes habitudes',tasks:'Mes tâches',notes:'Mes pensées',shopping:'Mes courses'};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
if(!Array.isArray(state.events))state.events=[];
const el=(tag,attrs={},text='')=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else n.setAttribute(k,v)}n.textContent=text;return n};
function list(parent,kind){const rows=state[kind];rows.forEach((entry,i)=>{const line=el('label',{class:'item'+(entry.done?' done':'')});const cb=el('input',{type:'checkbox'});cb.checked=!!entry.done;cb.onchange=()=>{entry.done=cb.checked;save();render()};line.append(cb,el('span',{},entry.text));parent.append(line)});const input=el('input',{type:'text',placeholder:kind==='shopping'?'Ajouter une course…':'Ajouter un élément…'});const btn=el('button',{class:'action'},'Ajouter');btn.onclick=()=>{if(input.value.trim()){rows.push({text:input.value.trim(),done:false});save();render()}};parent.append(input,btn)}
function panel(parent,title){const p=el('section',{class:'panel'});p.append(el('h2',{},title));parent.append(p);return p}
function render(){const root=document.getElementById('content');root.replaceChildren();const page=state.page;document.getElementById('title').textContent={journal:'Mon journal',tasks:'Mes tâches',shopping:'Mes courses',calendar:'Calendrier',capture:'Note rapide',settings:'Paramètres'}[page];document.getElementById('subtitle').textContent=page==='journal'?'Chaque petite chose a sa place.':'Mon petit espace tranquille 🌿';
if(page==='journal'){state.sections.filter(k=>state.visible[k]).forEach(k=>section(root,k))}
else if(page==='tasks'||page==='shopping')section(root,page);
else if(page==='calendar'){const p=panel(root,'Mes rendez-vous');const date=el('input',{type:'date','aria-label':'Date du rendez-vous'});const title=el('input',{type:'text',placeholder:'Nom du rendez-vous'});const btn=el('button',{class:'action'},'Ajouter au calendrier');btn.onclick=()=>{if(date.value&&title.value.trim()){state.events.push({date:date.value,text:title.value.trim(),id:crypto.randomUUID()});save();render()}};p.append(date,title,btn);[...state.events].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const row=el('div',{class:'item'});row.append(el('span',{},e.date+' — '+e.text));const del=el('button',{'aria-label':'Supprimer le rendez-vous'},'✕');del.onclick=()=>{state.events=state.events.filter(x=>x.id!==e.id);save();render()};row.append(del);p.append(row)})}
else if(page==='capture'){const p=panel(root,'Classer une nouvelle note');const kind=el('select',{'aria-label':'Destination'});for(const [value,name] of [['notes','Mes pensées'],['tasks','Mes tâches'],['shopping','Mes courses'],['habits','Mes habitudes']]){const o=el('option',{value},name);kind.append(o)}const ta=el('textarea',{placeholder:'Écris ici ce que tu veux garder…'});const btn=el('button',{class:'action'},'Enregistrer au bon endroit');btn.onclick=()=>{const text=ta.value.trim();if(!text)return;if(kind.value==='notes')state.notes.unshift(text);else state[kind.value].push({text,done:false});state.page=kind.value==='habits'||kind.value==='notes'?'journal':kind.value;save();render()};p.append(kind,ta,btn)}
else if(page==='settings'){const update=panel(root,'Mises à jour de Goblin');update.append(el('p',{class:'muted'},'Vérifie les versions Android officielles. Goblin télécharge uniquement une APK publiée et signée avec le même certificat que ton application. Android te demande toujours ton accord pour installer.'));const ver=el('p',{class:'muted',id:'goblinInstalledVersion'},'Version installée : vérification…');update.append(ver);const status=el('p',{class:'muted',id:'goblinUpdateStatus'},'Appuie sur Vérifier les mises à jour.');update.append(status);const check=el('button',{class:'action'},'↻ Vérifier les mises à jour');check.onclick=()=>{if(window.AtelierUpdates?.checkUpdates){status.textContent='Vérification de GitHub…';window.AtelierUpdates.checkUpdates()}else status.textContent='Cette version ne dispose pas encore du système natif de mise à jour.'};update.append(check);const notif=el('button',{class:'action'},'Activer les notifications Android');notif.onclick=()=>{if(window.AtelierUpdates?.enableUpdateNotifications)window.AtelierUpdates.enableUpdateNotifications();else alert('Fonction disponible après mise à jour de Goblin.')};update.append(notif);const install=el('button',{class:'action',id:'goblinInstallUpdate'},'⬇ Télécharger et installer');install.hidden=true;install.onclick=()=>{if(!confirm('Télécharger la version officielle de Goblin puis confirmer sa mise à jour dans Android ? Ne désinstalle jamais Goblin.'))return;if(window.AtelierUpdates?.installAvailable)window.AtelierUpdates.installAvailable()};update.append(install);const releases=el('button',{class:'action'},'Voir les versions publiées');releases.onclick=()=>{if(window.AtelierUpdates?.openReleases)window.AtelierUpdates.openReleases();else window.open('https://github.com/PetitElfe/atelier-releases/releases','_blank')};update.append(releases);updateUi();const p=panel(root,'Choisir mes sections');state.sections.forEach((k,i)=>{const row=el('div',{class:'item'});const cb=el('input',{type:'checkbox'});cb.checked=!!state.visible[k];cb.onchange=()=>{state.visible[k]=cb.checked;save()};row.append(cb,el('span',{},names[k]));const arrows=el('div',{class:'arrows'});for(const [symbol,offset] of [['↑',-1],['↓',1]]){const b=el('button',{},symbol);b.disabled=i+offset<0||i+offset>=state.sections.length;b.onclick=()=>{[state.sections[i],state.sections[i+offset]]=[state.sections[i+offset],state.sections[i]];save();render()};arrows.append(b)}row.append(arrows);p.append(row)})}}
function section(root,k){const p=panel(root,names[k]);if(k==='notes'){const ta=el('textarea',{placeholder:'Une pensée à garder…'});const btn=el('button',{class:'action'},'Conserver ma note');btn.onclick=()=>{if(ta.value.trim()){state.notes.unshift(ta.value.trim());save();render()}};p.append(ta,btn);state.notes.slice(0,5).forEach(n=>p.append(el('p',{},n)))}
else list(p,k)}
// Swipe between pages without interfering with vertical scrolling.
const pages=['journal','tasks','shopping','calendar','capture','settings'];
let startX=0,startY=0;
const main=document.querySelector('main');
main.addEventListener('touchstart',e=>{if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY}},{passive:true});
main.addEventListener('touchend',e=>{if(!startX||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;startX=0;startY=0;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.5){const next=pages.indexOf(state.page)+(dx<0?1:-1);if(next>=0&&next<pages.length){state.page=pages[next];save();render();window.scrollTo(0,0)}}},{passive:true});

/* One matching vector icon system for the drawer; no emoji icon fonts. */
const drawerShapes={
 journal:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 tasks:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="m8 13 3 3 5-6"/>',
 shopping:'<path d="m5 10 4-7M19 10l-4-7M3 10h18l-2 10H5L3 10Z"/><path d="M9 13v4M15 13v4"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h3M14 14h3"/>',
 capture:'<path d="M4 20h5L20 9a2 2 0 0 0-5-5L4 15v5ZM13 6l5 5"/>',
 connected:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4M6 10h3m6 0h3"/>',
 jdr:'<path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z"/><path d="M9 9h6M9 13h6M9 17h4"/>',

const computerKey='atelier-private-pc-url-v1';

let pc={tasks:[],shopping:[],recipes:[],events:[],notes:[]},online=false,error='',tab='calendar',calendarView='month',selected=new Date(),requests=new Map(),seq=0,loadId=0;
window.__atelierSyncResponse=(id,code,raw)=>{
 const x=requests.get(id);if(!x)return;requests.delete(id);clearTimeout(x.timeout);
 let body;try{body=JSON.parse(raw)}catch(e){body={error:'Réponse illisible'}};
 if(code>=200&&code<300)x.resolve(body);else x.reject(Error(body.error||'Connexion indisponible'));
};
function callPc(method,path,data,base=pcUrl){
 return new Promise((resolve,reject)=>{
  if(!window.AtelierTailnet){reject(Error('Version de l’APK incompatible avec la synchronisation.'));return}
  const id=String(++seq);
  const timeout=setTimeout(()=>{requests.delete(id);reject(Error('Connexion trop longue. Vérifie Tailscale et L’Atelier.'))},16000);
  requests.set(id,{resolve,reject,timeout});
  window.AtelierTailnet.request(id,base,method,path,JSON.stringify(data||{}));
 });
}
function isoDay(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
async function syncPull(){
 if(!pcUrl)return;
 const requestVersion=++loadId;
 try{
  const period=selected,from=new Date(period.getFullYear(),period.getMonth()-1,1),until=new Date(period.getFullYear(),period.getMonth()+2,0);
  // Independent reads: an older Windows build may not offer all optional routes.
  // Never treat an unavailable module as an empty list, or clear historic mobile data.
  const keys=['tasks','shopping','recipes','notes','events'];
  const paths=['/api/tasks','/api/shopping','/api/recipes','/api/mobile/notes','/api/events?start='+isoDay(from)+'&end='+isoDay(until)];
  const result=await Promise.allSettled(paths.map(path=>callPc('GET',path)));
  if(requestVersion!==loadId)return;
  const unavailable=[];
  let valid=0;
  result.forEach((r,i)=>{
   if(r.status==='fulfilled'&&Array.isArray(r.value)){pc[keys[i]]=r.value;valid++}
   else unavailable.push(keys[i]);
  });
  online=valid>0;
  error=unavailable.length?'Rubriques Windows indisponibles : '+unavailable.join(', ')+'. Vérifie la version de L’Atelier PC.':'';
  if(!online)error='Le PC ne répond pas aux rubriques demandées. Vérifie Tailscale et L’Atelier Windows.';
  render();
 }catch(e){if(requestVersion===loadId){online=false;error=e.message;render()}}
}

  if(!title.value.trim()&&!content.value.trim()){alert('Écris au moins un titre ou une note.');return}
  const now=new Date().toISOString();
  const note={id:editing?.id||'jdr-'+Date.now()+'-'+Math.random().toString(36).slice(2),title:title.value.trim()||'Note sans titre',tags:noteTags(tags.value),content:content.value.trim(),created:editing?.created||now,updated:now};
  if(editing)jdrNotes=jdrNotes.map(n=>n.id===editing.id?note:n);else jdrNotes.unshift(note);
  storeJdr();jdrEdit=null;render();
 };
 editor.append(title,tags,content,saveBtn);
 if(editing){const cancel=el('button',{type:'button',class:'action'},'Annuler');cancel.onclick=()=>{jdrEdit=null;render()};editor.append(cancel)}
 const notesPanel=panel(root,'Mes notes sur ce téléphone ('+jdrNotes.length+')');
 const rows=el('div');notesPanel.append(rows);
 function renderJdrRows(){
  rows.replaceChildren();
  const search=jdrQuery.trim().toLocaleLowerCase('fr-FR');
  const visible=jdrNotes.filter(n=>(!jdrFilter||noteTags((n.tags||[]).join(' ')+' '+n.title+' '+n.content).includes(jdrFilter))&&(!search||(n.title+' '+n.content+' '+(n.tags||[]).join(' ')).toLocaleLowerCase('fr-FR').includes(search)));
  if(!visible.length)rows.append(el('p',{class:'jdr-hint'},'Aucune note pour cette recherche.'));
  visible.forEach(note=>{
   const block=el('article',{class:'jdr-item'});block.append(el('h3',{},note.title));
   const tagLine=el('p',{class:'jdr-hint'},noteTags((note.tags||[]).join(' ')+' '+note.title+' '+note.content).join(' '));block.append(tagLine);
   const body=el('p',{},note.content);body.style.userSelect='text';block.append(body);
   const edit=el('button',{class:'action'},'Modifier');edit.onclick=()=>{jdrEdit=note.id;render();window.scrollTo(0,0)};
   const copy=el('button',{class:'action'},'Copier');copy.onclick=async()=>{try{await navigator.clipboard.writeText(note.title+'\n'+(note.tags||[]).join(' ')+'\n'+note.content);alert('Note copiée.')}catch(e){prompt('Copie ma note :',note.content)}};
   block.append(edit,copy);
   if(online){
    const send=el('button',{class:'action'},'Envoyer au PC');
    send.onclick=async()=>{send.disabled=true;try{
     const latest=await callPc('GET','/api/mobile/notes');
     if(!Array.isArray(latest))throw Error('Réponse PC inattendue');
     if(JSON.stringify(latest)!==JSON.stringify(pc.notes)){pc.notes=latest;throw Error('Les notes du PC ont changé : actualise et recommence pour éviter un écrasement.')}
     const remote={id:note.id,title:note.title,category:'JDR',content:((note.tags||[]).join(' ')+'\n'+note.content).trim(),updated:note.updated};
     if(latest.some(n=>n.id===note.id))throw Error('Cette note existe déjà sur le PC. Aucun doublon créé : vérifie les modifications sur PC.');
     await callPc('POST','/api/mobile/notes',{notes:[...latest,remote]});
     await syncPull();alert('Copie de la note envoyée au PC. La note locale reste intacte.');
    }catch(e){alert('Envoi non effectué : '+e.message)}finally{send.disabled=false}};
    block.append(send);
   }
   const del=el('button',{class:'action'},'Supprimer');del.onclick=()=>{if(!confirm('Supprimer cette note enregistrée sur le téléphone ?'))return;jdrNotes=jdrNotes.filter(n=>n.id!==note.id);storeJdr();render()};block.append(del);rows.append(block)
  });
 }
 renderJdrRows();
 const remote=panel(root,'Notes JDR de mon PC');
 if(!online){remote.append(el('p',{class:'jdr-hint'},'Hors connexion. Tes notes locales restent accessibles. Pour récupérer celles du PC, connecte-le avec Tailscale depuis Personnaliser.'));const c=el('button',{class:'action'},'Configurer mon PC');c.onclick=()=>{state.page='settings';save();render()};remote.append(c)}
 else{
  remote.append(el('p',{class:'jdr-hint'},'Notes récupérées depuis Windows. Elles ne sont pas supprimées par les notes locales.'));
  (Array.isArray(pc.notes)?pc.notes:[]).slice().reverse().forEach(n=>{const row=el('details',{class:'jdr-item'});row.append(el('summary',{},'#'+(n.category||'Général')+' — '+(n.title||'Sans titre')));const body=el('p',{},n.content||'');body.style.userSelect='text';row.append(body);remote.append(row)});
  const refresh=el('button',{class:'action'},'↻ Actualiser le PC');refresh.onclick=syncPull;remote.append(refresh);
 }
}

/* Offline local timers, Windows-synced recipes. Each countdown has an absolute end time. */
const kitchenTimerKey='goblin-mobile-kitchen-timers-v1';
let kitchenTimers=[];try{const v=JSON.parse(localStorage.getItem(kitchenTimerKey)||'[]');if(Array.isArray(v))kitchenTimers=v.filter(t=>t&&Number.isFinite(t.end)&&typeof t.label==='string').slice(0,16)}catch(e){}
let recipeFilter='',openedRecipeId=null,recipeBook='',kitchenSoundEnabled=true,kitchenVoiceEnabled=true,kitchenAudio=null;
function timerSave(){localStorage.setItem(kitchenTimerKey,JSON.stringify(kitchenTimers))}
function clockTime(ms){const n=Math.max(0,Math.ceil(ms/1000));return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(v=>String(v).padStart(2,'0')).join(':')}
function kitchenChime(){
 if(!kitchenSoundEnabled)return;
 try{
  // Original electronic bell; not a recording of any copyrighted song.
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  kitchenAudio=kitchenAudio||new AC();
  if(kitchenAudio.state==='suspended')kitchenAudio.resume();
  const at=kitchenAudio.currentTime;
  for(const [i,hz] of [660,880,1046,1320].entries()){
   const osc=kitchenAudio.createOscillator(),gain=kitchenAudio.createGain(),t=at+i*.17;
   osc.type='sine';osc.frequency.setValueAtTime(hz,t);
   gain.gain.setValueAtTime(.001,t);
   gain.gain.exponentialRampToValueAtTime(.13,t+.025);
   gain.gain.exponentialRampToValueAtTime(.001,t+.46);
   osc.connect(gain);gain.connect(kitchenAudio.destination);
   osc.start(t);osc.stop(t+.47);
  }
 }catch(e){}
}
function kitchenTick(){
 let finished=false;
 for(const t of kitchenTimers){if(t.running&&Date.now()>=t.end){t.running=false;t.ringing=true;t.remaining=0;finished=true}}
 if(finished){timerSave();kitchenChime();if(kitchenVoiceEnabled&&window.speechSynthesis&&window.SpeechSynthesisUtterance){try{const voice=new SpeechSynthesisUtterance('Beast mia miam !');voice.lang='fr-FR';voice.rate=1.05;window.speechSynthesis.speak(voice)}catch(e){}}if(navigator.vibrate)navigator.vibrate([160,100,160])}
 document.querySelectorAll('[data-kitchen-countdown]').forEach(node=>{
  const t=kitchenTimers.find(x=>x.id===node.dataset.kitchenCountdown);
  if(t)node.textContent=t.ringing?'🔔 Terminé !':clockTime(t.running?t.end-Date.now():t.remaining)
 });
 if(finished&&state.page==='grimoire'){const el=document.getElementById('kitchenAlerts');if(el)el.textContent='🔔 '+kitchenTimers.filter(t=>t.ringing).length+' cuisson(s) terminée(s)'}
}
setInterval(kitchenTick,800);
function parseIngredients(raw){
 if(Array.isArray(raw))return raw;
 if(typeof raw==='string'){try{const a=JSON.parse(raw);return Array.isArray(a)?a:[]}catch(e){}}
 return [];
}
function grimoireView(root){
 const intro=panel(root,'🍲 Mon grimoire de recettes');
 intro.append(el('p',{class:'jdr-hint'},'Recettes synchronisées avec L’Atelier Windows. Tu peux garder ta recette ouverte pendant plusieurs minuteurs nommés, même si la connexion se coupe.'));
 const refresh=el('button',{class:'action'},'↻ Actualiser depuis Windows');refresh.onclick=syncPull;intro.append(refresh);
 if(error)intro.append(el('p',{class:'jdr-hint'},'Connexion : '+error));
 if(!pcUrl){const conf=el('button',{class:'action'},'Configurer mon PC');conf.onclick=()=>{state.page='settings';save();render()};intro.append(conf)}
 const recipes=Array.isArray(pc.recipes)?pc.recipes:[];
 const search=el('input',{type:'text',placeholder:'Rechercher une recette ou un ingrédient…'});search.value=recipeFilter;
 const books=[...new Set(recipes.map(x=>x.book_name).filter(Boolean))].sort();
 const book=el('select',{'aria-label':'Livre de recettes'});
 book.append(el('option',{value:''},'Tous mes grimoires'));
 for(const name of books)book.append(el('option',{value:name},name));
 book.value=recipeBook;book.onchange=()=>{recipeBook=book.value;render()};intro.append(book,search);
 const results=el('div');intro.append(results);
 function draw(){
  results.replaceChildren();
  const q=recipeFilter.toLocaleLowerCase('fr-FR');
  const matches=recipes.filter(x=>(!recipeBook||x.book_name===recipeBook)&&[x.title,x.recipe,x.notes,x.ingredients_json].some(t=>String(t||'').toLocaleLowerCase('fr-FR').includes(q))).slice(0,100);
  if(!matches.length)results.append(el('p',{class:'jdr-hint'},'Aucune recette chargée pour cette recherche. Vérifie la synchronisation du PC.'));
  matches.forEach(x=>{
   const row=el('div',{class:'tool-card'}),open=el('button',{class:'action'},'📖 '+(x.title||'Recette'));
   open.onclick=()=>{openedRecipeId=String(x.id);render();window.scrollTo(0,0)};
   row.append(open);
   if(x.book_name)row.append(el('p',{class:'jdr-hint'},x.book_name));
   results.append(row);
  })
 }
 search.oninput=()=>{recipeFilter=search.value;draw()};draw();
 const active=recipes.find(x=>String(x.id)===openedRecipeId);
 if(active){
  // Keep the recipe visible immediately, rather than below a long recipe catalogue.
  intro.hidden=true;
  const card=panel(root,'📖 '+(active.title||'Ma recette'));
  card.id='kitchenRecipe';
  const jump=el('button',{class:'action'},'⏱ Ajouter un minuteur');jump.onclick=()=>document.getElementById('kitchenTimerPanel')?.scrollIntoView({behavior:'smooth',block:'start'});card.append(jump);
  const choose=el('button',{class:'action'},'← Autres recettes');choose.onclick=()=>{openedRecipeId=null;render()};card.append(choose);
  if(active.book_name)card.append(el('p',{class:'jdr-hint'},'Livre : '+active.book_name));
  if(active.base_servings)card.append(el('p',{class:'jdr-hint'},'Portions de base : '+active.base_servings));
  const ingredients=parseIngredients(active.ingredients_json);
  if(ingredients.length){
   card.append(el('h2',{},'Ingrédients'));
   ingredients.forEach(item=>{
    const label=typeof item==='string'?item:[item.quantity,item.unit,item.name||item.ingredient||item.label].filter(x=>x!==undefined&&x!==null&&String(x).trim()).join(' ');
    card.append(el('p',{},'• '+label));
   })
  }
  if(active.recipe){card.append(el('h2',{},'Préparation'));const txt=el('p',{},String(active.recipe));txt.style.whiteSpace='pre-wrap';card.append(txt)}
  if(active.notes){card.append(el('h2',{},'Notes'));const txt=el('p',{},String(active.notes));txt.style.whiteSpace='pre-wrap';card.append(txt)}
 }
 const timers=panel(root,'⏲ Mes minuteurs de cuisine');timers.id='kitchenTimerPanel';
 timers.append(el('p',{class:'jdr-hint'},'Tu peux lancer « Œufs — 8 minutes » et « Four — 25 minutes » en même temps, tout en lisant la recette.'));
 const label=el('input',{type:'text',placeholder:'Libellé : œufs, four, pâtes…','aria-label':'Nom du minuteur'});
 const mins=el('input',{type:'number',min:'0',max:'1440',placeholder:'Minutes','aria-label':'Minutes'}),secs=el('input',{type:'number',min:'0',max:'59',placeholder:'Secondes','aria-label':'Secondes'});
 mins.value='8';secs.value='0';mins.style.width='48%';secs.style.width='48%';
 const row=el('div',{class:'arrows'});row.append(mins,secs);
 const presets=el('div',{class:'jdr-tags'});for(const n of [3,5,8,10,15,20]){const btn=el('button',{class:'jdr-tag'},n+' min');btn.onclick=()=>{mins.value=String(n);secs.value='0'};presets.append(btn)}
 const add=el('button',{class:'action'},'＋ Démarrer ce minuteur');
 add.onclick=()=>{
  const duration=(Number(mins.value)||0)*60000+(Number(secs.value)||0)*1000;
  if(!Number.isFinite(duration)||duration<1000||duration>86400000){alert('Choisis une durée entre 1 seconde et 24 heures.');return}
  if(kitchenTimers.length>=16){alert('Maximum 16 minuteurs. Supprime un minuteur terminé.');return}
  // Unlock sound without playing the end-of-timer chime at startup.
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){kitchenAudio=kitchenAudio||new AC();if(kitchenAudio.state==='suspended')kitchenAudio.resume()}}catch(e){}
  const now=Date.now();
  kitchenTimers.push({id:'cook-'+now+'-'+Math.random().toString(36).slice(2),label:label.value.trim().slice(0,80)||'Cuisson',end:now+duration,remaining:duration,running:true,ringing:false});
  timerSave();render();
  if(openedRecipeId)document.getElementById('kitchenRecipe')?.scrollIntoView({block:'start'});
 };
 timers.append(label,presets,row,add);
 const mute=el('button',{class:'action'},kitchenSoundEnabled?'🔊 Son activé':'🔇 Son désactivé');
 mute.onclick=()=>{kitchenSoundEnabled=!kitchenSoundEnabled;render()};timers.append(mute);
 const voice=el('button',{class:'action'},kitchenVoiceEnabled?'🗣 Mia miam activé':'🗣 Mia miam désactivé');voice.onclick=()=>{kitchenVoiceEnabled=!kitchenVoiceEnabled;render()};timers.append(voice);
 const alerts=el('p',{id:'kitchenAlerts',class:'jdr-hint'},'');timers.append(alerts);
 kitchenTimers.forEach(t=>{
  const row=el('div',{class:'tool-card'});row.append(el('h3',{},t.label));
  const countdown=el('p',{'data-kitchen-countdown':t.id},t.ringing?'🔔 Terminé !':clockTime(t.running?t.end-Date.now():t.remaining));countdown.style.fontSize='24px';row.append(countdown);
  const toggle=el('button',{class:'action'},t.ringing?'Arrêter l’alerte':t.running?'Pause':'Reprendre');
  toggle.onclick=()=>{if(t.ringing){t.ringing=false;t.remaining=0}else if(t.running){t.remaining=Math.max(0,t.end-Date.now());t.running=false}else{t.end=Date.now()+Math.max(1000,t.remaining);t.running=true}timerSave();render()};
  const del=el('button',{class:'action'},'Supprimer');del.onclick=()=>{kitchenTimers=kitchenTimers.filter(x=>x.id!==t.id);timerSave();render()};
  row.append(toggle,del);timers.append(row);
 });
 timers.append(el('p',{class:'jdr-hint'},'Important : laisse Goblin ouvert au premier plan pour entendre l’alerte. En arrière-plan ou écran verrouillé, Android peut suspendre le son et les scripts. Le temps restant est recalculé lorsque tu reviens.'));
 kitchenTick();
}


function renderOrganizedSettings(){
 const root=document.getElementById('content');
 const list=Array.from(root.querySelectorAll(':scope > .panel'));
 if(list.length<5)return;
 const lookup=new Map(list.map(p=>[p.querySelector('h2')?.textContent,p]));
 root.replaceChildren();
 for(const [section,heading,title] of [
  ['Connexion au PC','Synchronisation privée avec le PC','Relier mon ordinateur'],
  ['Sauvegardes et données','Sauvegarder mes données du téléphone','Exporter mes données'],
  ['Apparence','Apparence de mon Atelier','Thème'],
  ['Accueil et navigation','Choisir mes sections','Organiser mon accueil'],
  ['Mises à jour','Mises à jour de Goblin','Version et mises à jour']
 ]){
  const p=lookup.get(heading);if(!p)continue;
  const group=el('section',{class:'settings-group'});
  group.append(el('h2',{},section));p.querySelector('h2').textContent=title;
  group.append(p);root.append(group);
 }
}
const existingRenderGoblin=render;
render=function(){
 if(state.page==='grimoire'){
  document.getElementById('title').textContent='Grimoire de recettes';
  document.getElementById('subtitle').textContent='Mes recettes et minuteurs de cuisine.';
  const root=document.getElementById('content');root.replaceChildren();grimoireView(root);updateNav();return;
 }
 if(state.page==='jdr'){
  document.getElementById('title').textContent='Notes JDR #';
  document.getElementById('subtitle').textContent='Classer et retrouver mes idées, même sans PC.';
  const root=document.getElementById('content');root.replaceChildren();jdrView(root);updateNav();return;
 }
 existingRenderGoblin();
 if(state.page==='settings')renderOrganizedSettings();
};
function goHome(){
 document.getElementById('nav').hidden=true;
 jdrEdit=null;
 state.page='journal';save();render();window.scrollTo(0,0);
}
document.getElementById('home').onclick=goHome;
document.getElementById('quickSettings').onclick=()=>{state.page='settings';save();render();window.scrollTo(0,0)};
document.getElementById('openGoblinUpdate').onclick=()=>{state.page='settings';save();render();window.scrollTo(0,0)};
document.getElementById('dismissGoblinUpdate').onclick=()=>{
 const version=goblinUpdate.version||localStorage.getItem('goblin-update-available-v1')||'';
 sessionStorage.setItem('goblin-update-banner-dismissed',version);
 updateUi();
};
window.__atelierHandleAndroidBack=function(){
 if(!document.getElementById('nav').hidden){document.getElementById('nav').hidden=true;return 'handled'}
 if(jdrEdit){jdrEdit=null;render();return 'handled'}
 if(state.page!=='journal'){goHome();return 'handled'}
 return 'exit';
};

render();
if(pcUrl)syncPull();
updateUi();
setTimeout(autoCheckGoblin,1800);
