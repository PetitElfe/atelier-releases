<script>
/* Capture existing 0.1.5 WebView localStorage before the new app reads or edits it.
   Snapshots live in Android app-private files, never in a remote service. */
function goblinSnapshot(reason='manual'){
 try{
  if(!window.AtelierAutoBackup?.snapshot)return false;
  const entries=Object.create(null);
  for(let i=0;i<localStorage.length;i++){
   const key=localStorage.key(i);
   if(key!==null)entries[key]=localStorage.getItem(key);
  }
  if(!Object.keys(entries).length)return false;
  return !!window.AtelierAutoBackup.snapshot(JSON.stringify({
   ...(window.goblinStudioBackup?{studio:window.goblinStudioBackup}:{}),format:'goblin-localstorage-v1',savedAt:new Date().toISOString(),entries,...(window.goblinBackupAudio?{kitchenAudio:window.goblinBackupAudio}:{}),...(window.AtelierReminders?.backup?{nativeReminders:JSON.parse(window.AtelierReminders.backup())}:{})
  }),reason);
 }catch(e){return false}
}
const goblinFirstBackupOkay=goblinSnapshot('startup');
async function goblinRestoreBackup(raw){
 let parsed;
 try{parsed=JSON.parse(raw)}catch(e){alert('Sauvegarde illisible. Rien n’a été modifié.');return}
 const entries=parsed?.format==='goblin-localstorage-v1'?parsed.entries:
  parsed?.format==='atelier-goblin-android-backup-v2'?parsed.allLocalStorage:null;
 if(!entries||typeof entries!=='object'||Array.isArray(entries)||!Object.keys(entries).length||
   !Object.entries(entries).every(([k,v])=>typeof k==='string'&&typeof v==='string')){
  alert('Format de sauvegarde incompatible. Rien n’a été modifié.');return;
 }
 if(!confirm('Restaurer cette sauvegarde ? Les valeurs enregistrées remplaceront celles du téléphone pour les mêmes rubriques.'))return;
 if(!goblinSnapshot('pre-restore')){
  alert('Impossible de sauvegarder les données actuelles avant restauration. Opération annulée.');return;
 }
 try{
  if(parsed.nativeReminders&&window.AtelierReminders&&!window.AtelierReminders.restore(JSON.stringify(parsed.nativeReminders)))throw Error('Les rappels n’ont pas pu être restaurés.');
  if(parsed.studio){if(!window.goblinStudioRestore)throw Error('Le stockage des albums n’est pas prêt.');await window.goblinStudioRestore(parsed.studio);}
  for(const [key,value] of Object.entries(entries))localStorage.setItem(key,value);
  if(parsed.kitchenAudio&&window.goblinRestoreAudio){window.goblinRestoreAudio(parsed.kitchenAudio).then(()=>location.reload()).catch(()=>alert('Le son n’a pas pu être restauré. Les autres données sont conservées ; garde la copie de secours.'));return;}
  location.reload();
 }catch(e){alert('Restauration incomplète. Restaure la sauvegarde de sécurité depuis Paramètres.')}
}

const defaults={page:'journal',sections:['habits','tasks','notes','shopping'],visible:{habits:true,tasks:true,notes:true,shopping:false},habits:[{text:'Prendre un moment pour moi',done:false},{text:'Boire de l’eau',done:false}],tasks:[],shopping:[],notes:[],events:[]};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)}
const names={habits:'Mes habitudes',tasks:'Mes tâches',notes:'Mes pensées',shopping:'Mes courses'};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));

function callPc(method,path,data,base=pcUrl){

  if(!window.AtelierTailnet){reject(Error('Version de l’APK incompatible avec la synchronisation.'));return}
  const id=String(++seq);
  const timeout=setTimeout(()=>{requests.delete(id);reject(Error('Connexion trop longue. Vérifie Tailscale et L’Atelier.'))},16000);
  requests.set(id,{resolve,reject,timeout});

function isoDay(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
// Keep keyboard input and local journal drafts intact during background syncs.
function syncEditorActive(){
 const active=document.activeElement;
 return !!(active && active.closest && active.closest('#content') &&
  (active.isContentEditable || active.tagName==='TEXTAREA' ||
   (active.tagName==='INPUT' && !['checkbox','radio','button'].includes(active.type)) ||
   active.tagName==='SELECT'));
}
async function syncPull({quiet=false}={}){
 if(!pcUrl || (quiet && (document.visibilityState==='hidden' || syncEditorActive())))return;
 const requestVersion=++loadId;
 const before=quiet?JSON.stringify(pc):null;
 const wasOnline=online,previousError=error;
 try{
  const period=selected,from=new Date(period.getFullYear(),period.getMonth()-1,1),until=new Date(period.getFullYear(),period.getMonth()+2,0);
  // Independent reads: an older Windows build may not offer all optional routes.
  // Never treat an unavailable module as an empty list, or clear historic mobile data.
  const keys=['tasks','shopping','recipes','notes','events'];
  const paths=['/api/tasks','/api/shopping','/api/recipes','/api/mobile/notes','/api/events?start='+isoDay(from)+'&end='+isoDay(until)];
  const result=await Promise.allSettled(paths.map(path=>callPc('GET',path)));
  if(requestVersion!==loadId)return;
  const unavailable=[];
  let valid=0;
  result.forEach((r,i)=>{
   if(r.status==='fulfilled'&&Array.isArray(r.value)){pc[keys[i]]=r.value;valid++}
   else unavailable.push(keys[i]);
  });
  online=valid>0;
  if(online)lastSyncAt=Date.now();
  updatePcSyncStamp();
  error=unavailable.length?'Rubriques Windows indisponibles : '+unavailable.join(', ')+'. Vérifie la version de L’Atelier PC.':'';
  if(!online)error='Le PC ne répond pas aux rubriques demandées. Vérifie Tailscale et L’Atelier Windows.';
  if(!quiet || ((wasOnline!==online || previousError!==error || before!==JSON.stringify(pc)) && !syncEditorActive()))render();
 }catch(e){
  if(requestVersion===loadId){
   online=false;error=e.message;
   if(!quiet || ((wasOnline!==online || previousError!==error) && !syncEditorActive()))render();
  }
 }
}

/* The user selected the ACTUAL Freesound "Beast miam miam comedy sound",
   not a synthesized bell and not a text-to-speech impersonation.
   It must be imported once and stored as a Blob, never as 5MB+ localStorage.
   The clip is CC0: freesound.org/people/Piement_infernal/sounds/772687/ */
const MIAM_DB='goblin-kitchen-miam-audio-v1', MIAM_KEY='beast-miam-miam';
function kitchenAudioDatabase(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(new Error('Le stockage audio de ce téléphone est indisponible.'));return}
  const request=indexedDB.open(MIAM_DB,1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('sounds'))request.result.createObjectStore('sounds')};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('Stockage audio inaccessible'));
 });
}
async function kitchenStoredMiam(){
 const db=await kitchenAudioDatabase();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('sounds','readonly'),request=tx.objectStore('sounds').get(MIAM_KEY);
  request.onsuccess=()=>resolve(request.result||null);
  request.onerror=()=>reject(request.error||new Error('Lecture audio impossible'));
  tx.oncomplete=()=>db.close();
  tx.onabort=()=>{db.close();reject(tx.error||new Error('Lecture interrompue'))};
 });
}
async function kitchenImportMiam(file){
 if(!file)throw new Error('Choisis le fichier Beast Miam Miam.');
 if(file.size>12*1024*1024)throw new Error('Fichier trop lourd (12 Mo maximum).');
 if(!(/\.(wav|mp3|ogg|m4a)$/i.test(file.name)||String(file.type).startsWith('audio/')))throw new Error('Choisis un fichier audio WAV, MP3, OGG ou M4A.');
 const db=await kitchenAudioDatabase();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('sounds','readwrite');
