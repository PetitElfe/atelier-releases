<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L’Atelier du Goblin — prototype mobile</title>
<style>
:root{font-family:system-ui,sans-serif;color:#443e31;background:#24372d}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;background:#24372d;color:#f0e2c3;padding:calc(15px + env(safe-area-inset-top, 0px)) 16px 15px;display:flex;align-items:center;justify-content:space-between;z-index:2}header button{background:none;border:0;color:inherit;font-size:26px}header strong{font-family:Georgia,serif;font-size:19px}.paper{background:#f1e5c9;min-height:calc(100dvh - 70px);padding:24px 18px 70px;border-radius:20px 20px 0 0}h1,h2{font-family:Georgia,serif;color:#3d5a45}h1{text-align:center;font-size:28px;margin:4px 0 6px}h2{font-size:19px;margin:0 0 12px}.sub{text-align:center;color:#786e57;font-size:13px;margin-bottom:25px}.panel{background:#fff9eb;border:1px solid #d7c9a7;border-radius:15px;padding:17px;margin:14px 0}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e8dcc5}.item:last-child{border:0}.item input{accent-color:#547b5b;width:21px;height:21px}.item span{flex:1}.item.done span{text-decoration:line-through;color:#8d8a7d}textarea,input[type=text]{width:100%;background:#fffdf6;border:1px solid #c8ba9c;border-radius:10px;padding:12px;color:#443e31}textarea{min-height:90px}.action{background:#496a50;color:white;border:0;border-radius:10px;padding:11px 15px;margin-top:9px}.nav{position:fixed;z-index:5;inset:0 auto 0 0;width:min(82vw,310px);background:#263b30;color:#f3e6c8;padding:calc(24px + env(safe-area-inset-top, 0px)) 18px 24px;box-shadow:0 0 0 100vmax #0008}.nav button{display:block;width:100%;text-align:left;padding:14px;background:transparent;color:inherit;border:0;border-bottom:1px solid #ffffff25}.nav[hidden],[hidden]{display:none!important}.muted{font-size:13px;color:#81765f}.arrows{display:flex;gap:8px}.arrows button{border:1px solid #cfc09f;border-radius:8px;background:#f1e5c9;padding:5px 9px}.footer{text-align:center;font-size:12px;color:#8b816b;margin-top:30px}select,input[type=date]{width:100%;background:#fffdf6;border:1px solid #c8ba9c;border-radius:10px;padding:12px;color:#443e31;margin:5px 0}

/* Mobile Goblin redesign: preserves existing localStorage and old pages. */
:root{--page-bg:#17231e;--header-bg:#192b22;--paper-bg:#202e26;--card-bg:#2a3b2f;--card-border:#5e755f;--ink:#f1ebd8;--muted-ink:#b7c8b3;--accent:#9ebc86;--field-bg:#1d2b23;--field-border:#6b866e;--tab-bg:#1b2c23;--tab-color:#d8e5ce}
body{background:var(--page-bg);color:var(--ink)}
header{background:var(--header-bg);color:var(--ink);border-bottom:1px solid var(--card-border)}
.paper{background:var(--paper-bg);color:var(--ink);padding-bottom:calc(115px + env(safe-area-inset-bottom,0px));min-height:100dvh;border-radius:19px 19px 0 0}
h1,h2{color:var(--accent)}.sub,.muted,.footer{color:var(--muted-ink)}
.panel{background:var(--card-bg);border-color:var(--card-border);box-shadow:0 6px 20px #0a160d24}
.item{border-color:var(--card-border)}
.item.done span{color:var(--muted-ink)}
textarea,input[type=text],select,input[type=date],input[type=time]{background:var(--field-bg);border:1px solid var(--field-border);color:var(--ink)}
.action{background:#577e5e;color:#fff}
.arrows button{border:1px solid var(--card-border);background:var(--field-bg);color:var(--ink)}
.nav{background:var(--header-bg);color:var(--ink)}
.mobile-tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;background:var(--tab-bg);color:var(--tab-color);display:flex;align-items:center;justify-content:space-around;padding:9px 6px calc(9px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--card-border);box-shadow:0 -8px 25px #0004}
.mobile-tabs button{border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:3px;padding:4px 2px;min-width:55px}
.mobile-tabs button.active{color:var(--accent);font-weight:800}
.mobile-tabs .tab-icon{font-size:23px;line-height:27px}
.mobile-tabs .star-tab{background:#416748;color:#fff;width:60px;height:60px;border:4px solid var(--tab-bg);border-radius:50%;margin-top:-26px;min-width:60px;box-shadow:0 5px 16px #0007;justify-content:center}
.mobile-tabs .star-tab .tab-icon{font-size:30px}
.tool-card{background:var(--field-bg);padding:13px;border-radius:13px;border:1px solid var(--card-border);margin:11px 0}
.tool-card h3{font-size:16px;margin:0 0 7px;color:var(--accent)}
.tool-card p{line-height:1.5}
.tool-card .action{margin:4px 4px 5px 0}
.theme-choice{display:flex;flex-direction:column;gap:8px}.theme-choice label{display:flex;align-items:center;gap:8px}.theme-choice input{accent-color:#81a986}
body.theme-classic{--page-bg:#24372d;--header-bg:#24372d;--paper-bg:#f1e5c9;--card-bg:#fff9eb;--card-border:#d7c9a7;--ink:#443e31;--muted-ink:#786e57;--accent:#3d5a45;--field-bg:#fffdf6;--field-border:#c8ba9c;--tab-bg:#f1e5c9;--tab-color:#3d5a45}
body.theme-classic header{color:#f0e2c3}
body.theme-classic .nav{color:#f0e2c3}
body.theme-classic .star-tab{color:#fff}
@media(min-width:680px){.paper{max-width:640px;margin:auto}.mobile-tabs{justify-content:center;gap:50px}}
</style></head><body>
<header><button id="menu" aria-label="Ouvrir le menu">☰</button><strong>L’Atelier du Goblin</strong><span aria-hidden="true">🌿</span></header>
<nav class="nav" id="nav" hidden><button id="close">✕ Fermer</button><button data-page="journal">📖 Mon journal</button><button data-page="tasks">☑ Mes tâches</button><button data-page="shopping">🧺 Mes courses</button><button data-page="calendar">▦ Calendrier</button><button data-page="capture">✎ Note rapide</button><button data-page="connected">🔄 Mon Atelier synchronisé</button><button data-page="settings">⚙ Personnaliser</button><button data-page="tools">☆ Mes outils</button></nav>
<main class="paper"><h1 id="title">Mon journal</h1><p class="sub" id="subtitle">Chaque petite chose a sa place.</p><div id="content"></div><p class="footer">Glisse à gauche ou à droite pour changer de page • données locales conservées</p></main>
<nav class="mobile-tabs" id="mobileTabs" aria-label="Navigation rapide">
<button type="button" data-mobile-go="connected" aria-label="Calendrier et Atelier synchronisé"><span class="tab-icon">▦</span>Calendrier</button>
<button type="button" data-mobile-go="connected" data-mobile-section="notes"><span class="tab-icon">✎</span>Notes JDR</button>
<button type="button" class="star-tab" data-mobile-go="tools" aria-label="Mes outils apaisement"><span class="tab-icon">☆</span></button>
<button type="button" data-mobile-go="connected" data-mobile-section="shopping"><span class="tab-icon">♧</span>Courses</button>
<button type="button" data-mobile-go="connected" data-mobile-section="tasks"><span class="tab-icon">☑</span>To-Do</button>
</nav>
<script>
const KEY='goblin-mobile-prototype-v1';
const defaults={page:'journal',sections:['habits','tasks','notes','shopping'],visible:{habits:true,tasks:true,notes:true,shopping:false},habits:[{text:'Prendre un moment pour moi',done:false},{text:'Boire de l’eau',done:false}],tasks:[],shopping:[],notes:[],events:[]};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)}
const names={habits:'Mes habitudes',tasks:'Mes tâches',notes:'Mes pensées',shopping:'Mes courses'};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
if(!Array.isArray(state.events))state.events=[];
const el=(tag,attrs={},text='')=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else n.setAttribute(k,v)}n.textContent=text;return n};
function list(parent,kind){const rows=state[kind];rows.forEach((entry,i)=>{const line=el('label',{class:'item'+(entry.done?' done':'')});const cb=el('input',{type:'checkbox'});cb.checked=!!entry.done;cb.onchange=()=>{entry.done=cb.checked;save();render()};line.append(cb,el('span',{},entry.text));parent.append(line)});const input=el('input',{type:'text',placeholder:kind==='shopping'?'Ajouter une course…':'Ajouter un élément…'});const btn=el('button',{class:'action'},'Ajouter');btn.onclick=()=>{if(input.value.trim()){rows.push({text:input.value.trim(),done:false});save();render()}};parent.append(input,btn)}
function panel(parent,title){const p=el('section',{class:'panel'});p.append(el('h2',{},title));parent.append(p);return p}
function render(){const root=document.getElementById('content');root.replaceChildren();const page=state.page;document.getElementById('title').textContent={journal:'Mon journal',tasks:'Mes tâches',shopping:'Mes courses',calendar:'Calendrier',capture:'Note rapide',settings:'Personnaliser'}[page];document.getElementById('subtitle').textContent=page==='journal'?'Chaque petite chose a sa place.':'Mon petit espace tranquille 🌿';
if(page==='journal'){state.sections.filter(k=>state.visible[k]).forEach(k=>section(root,k))}
else if(page==='tasks'||page==='shopping')section(root,page);
else if(page==='calendar'){const p=panel(root,'Mes rendez-vous');const date=el('input',{type:'date','aria-label':'Date du rendez-vous'});const title=el('input',{type:'text',placeholder:'Nom du rendez-vous'});const btn=el('button',{class:'action'},'Ajouter au calendrier');btn.onclick=()=>{if(date.value&&title.value.trim()){state.events.push({date:date.value,text:title.value.trim(),id:crypto.randomUUID()});save();render()}};p.append(date,title,btn);[...state.events].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const row=el('div',{class:'item'});row.append(el('span',{},e.date+' — '+e.text));const del=el('button',{'aria-label':'Supprimer le rendez-vous'},'✕');del.onclick=()=>{state.events=state.events.filter(x=>x.id!==e.id);save();render()};row.append(del);p.append(row)})}
else if(page==='capture'){const p=panel(root,'Classer une nouvelle note');const kind=el('select',{'aria-label':'Destination'});for(const [value,name] of [['notes','Mes pensées'],['tasks','Mes tâches'],['shopping','Mes courses'],['habits','Mes habitudes']]){const o=el('option',{value},name);kind.append(o)}const ta=el('textarea',{placeholder:'Écris ici ce que tu veux garder…'});const btn=el('button',{class:'action'},'Enregistrer au bon endroit');btn.onclick=()=>{const text=ta.value.trim();if(!text)return;if(kind.value==='notes')state.notes.unshift(text);else state[kind.value].push({text,done:false});state.page=kind.value==='habits'||kind.value==='notes'?'journal':kind.value;save();render()};p.append(kind,ta,btn)}
else if(page==='settings'){const update=panel(root,'Mises à jour');update.append(el('p',{class:'muted'},'Les mises à jour sont disponibles dans ton dépôt GitHub privé. Ouvre la page avec ton compte GitHub, télécharge le nouvel APK et confirme son installation Android. Tes données locales restent en place lors d’une mise à jour signée avec la même clé.'));const check=el('button',{class:'action'},'Ouvrir les mises à jour');check.onclick=()=>{if(window.AtelierUpdates)window.AtelierUpdates.openReleases();else window.open('https://github.com/PetitElfe/atelier-releases/releases','_blank')};update.append(check);const p=panel(root,'Choisir mes sections');state.sections.forEach((k,i)=>{const row=el('div',{class:'item'});const cb=el('input',{type:'checkbox'});cb.checked=!!state.visible[k];cb.onchange=()=>{state.visible[k]=cb.checked;save()};row.append(cb,el('span',{},names[k]));const arrows=el('div',{class:'arrows'});for(const [symbol,offset] of [['↑',-1],['↓',1]]){const b=el('button',{},symbol);b.disabled=i+offset<0||i+offset>=state.sections.length;b.onclick=()=>{[state.sections[i],state.sections[i+offset]]=[state.sections[i+offset],state.sections[i]];save();render()};arrows.append(b)}row.append(arrows);p.append(row)})}}
function section(root,k){const p=panel(root,names[k]);if(k==='notes'){const ta=el('textarea',{placeholder:'Une pensée à garder…'});const btn=el('button',{class:'action'},'Conserver ma note');btn.onclick=()=>{if(ta.value.trim()){state.notes.unshift(ta.value.trim());save();render()}};p.append(ta,btn);state.notes.slice(0,5).forEach(n=>p.append(el('p',{},n)))}
else list(p,k)}
// Swipe between pages without interfering with vertical scrolling.
const pages=['journal','tasks','shopping','calendar','capture','settings'];
let startX=0,startY=0;
const main=document.querySelector('main');
main.addEventListener('touchstart',e=>{if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY}},{passive:true});
main.addEventListener('touchend',e=>{if(!startX||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;startX=0;startY=0;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.5){const next=pages.indexOf(state.page)+(dx<0?1:-1);if(next>=0&&next<pages.length){state.page=pages[next];save();render();window.scrollTo(0,0)}}},{passive:true});
document.getElementById('menu').onclick=()=>document.getElementById('nav').hidden=false;
document.getElementById('close').onclick=()=>document.getElementById('nav').hidden=true;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();document.getElementById('nav').hidden=true;render()});

const computerKey='atelier-private-pc-url-v1';
let pcUrl=localStorage.getItem(computerKey)||'';
let pc={tasks:[],shopping:[],recipes:[],events:[],notes:[]},online=false,error='',tab='calendar',calendarView='month',selected=new Date(),requests=new Map(),seq=0;
window.__atelierSyncResponse=(id,code,raw)=>{
 const x=requests.get(id);if(!x)return;requests.delete(id);clearTimeout(x.timeout);
 let body;try{body=JSON.parse(raw)}catch(e){body={error:'Réponse illisible'}};
 if(code>=200&&code<300)x.resolve(body);else x.reject(Error(body.error||'Connexion indisponible'));
};
function callPc(method,path,data,base=pcUrl){
 return new Promise((resolve,reject)=>{
  if(!window.AtelierTailnet){reject(Error('Version de l’APK incompatible avec la synchronisation.'));return}
  const id=String(++seq);
  const timeout=setTimeout(()=>{requests.delete(id);reject(Error('Connexion trop longue. Vérifie Tailscale et L’Atelier.'))},16000);
  requests.set(id,{resolve,reject,timeout});
  window.AtelierTailnet.request(id,base,method,path,JSON.stringify(data||{}));
 });
}
function isoDay(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
async function syncPull(){
 if(!pcUrl)return;
 try{
  const period=selected,from=new Date(period.getFullYear(),period.getMonth()-1,1),until=new Date(period.getFullYear(),period.getMonth()+2,0);
  const result=await Promise.all([callPc('GET','/api/tasks'),callPc('GET','/api/shopping'),callPc('GET','/api/recipes'),callPc('GET','/api/mobile/notes'),callPc('GET','/api/events?start='+isoDay(from)+'&end='+isoDay(until))]);
  pc={tasks:result[0],shopping:result[1],recipes:result[2],notes:result[3],events:result[4]};online=true;error='';render();
 }catch(e){online=false;error=e.message;render()}
}
async function syncWrite(method,path,payload){try{await callPc(method,path,payload);await syncPull()}catch(e){alert('Modification non confirmée : '+e.message)}}
function connectedSettings(root){
 const p=panel(root,'Synchronisation privée avec le PC');
 p.append(el('p',{class:'muted'},'Adresse HTTPS Tailscale du PC (sans /mobile.html). Les anciennes données de l’APK sont conservées séparément et ne sont pas effacées.'));
 const input=el('input',{type:'text',placeholder:'https://ordinateur.reseau.ts.net'});input.value=pcUrl;p.append(input);
 const connect=el('button',{class:'action'},'Tester et connecter');
 connect.onclick=async()=>{
  const value=input.value.trim();let u;
  try{u=new URL(value);if(u.protocol!=='https:'||!u.hostname.endsWith('.ts.net')||u.port||u.username||u.password||(u.pathname!=='/'&&u.pathname!=='')||u.search||u.hash)throw Error('Adresse non autorisée');
   const clean=u.origin;await callPc('GET','/api/tasks',null,clean);pcUrl=clean;localStorage.setItem(computerKey,clean);state.page='connected';save();await syncPull();
  }catch(e){alert('Connexion impossible : '+e.message)}
 };
 const offline=el('button',{class:'action'},'Déconnecter et garder mes données locales');
 offline.onclick=()=>{pcUrl='';localStorage.removeItem(computerKey);online=false;state.page='journal';save();render()};
 const refresh=el('button',{class:'action'},'Actualiser');
 refresh.onclick=syncPull;
 p.append(connect,refresh,offline);
}
function connectedView(root){
 const p=panel(root,'Les données de mon ordinateur');
 p.append(el('p',{class:'muted'},online?'✓ Connecté en privé via Tailscale':error?'⚠ '+error:'Connexion au PC en cours…'));
 const refresh=el('button',{class:'action'},'↻ Actualiser');refresh.onclick=syncPull;p.append(refresh);
 if(!online){const set=el('button',{class:'action'},'Configurer l’accès au PC');set.onclick=()=>{state.page='settings';save();render()};p.append(set);return;}
 const tabs=el('div',{class:'arrows'});
 [['calendar','Calendrier'],['tasks','To-Do'],['shopping','Courses'],['recipes','Recettes'],['notes','Notes JDR']].forEach(([key,title])=>{
  const btn=el('button',{},(tab===key?'● ':'')+title);btn.onclick=()=>{tab=key;render()};tabs.append(btn)
 });p.append(tabs);
 if(tab==='tasks'||tab==='shopping'){
  const rows=pc[tab]||[];
  rows.forEach(item=>{
   const line=el('label',{class:'item'+(item.completed||item.checked?' done':'')});
   const box=el('input',{type:'checkbox'});box.checked=!!(tab==='tasks'?item.completed:item.checked);
   box.onchange=()=>syncWrite('PUT','/api/'+tab+'/'+item.id,tab==='tasks'?{completed:box.checked}:{checked:box.checked});
   line.append(box,el('span',{},tab==='tasks'?item.title:item.name));p.append(line);
  });
  const input=el('input',{type:'text',placeholder:'Ajouter sur mon PC…'}),btn=el('button',{class:'action'},'Ajouter au PC');
  btn.onclick=()=>{if(input.value.trim())syncWrite('POST','/api/'+tab,tab==='tasks'?{title:input.value.trim()}:{name:input.value.trim()})};
  p.append(input,btn);
  const local=state[tab]||[];
  if(local.length){const old=el('details');old.append(el('summary',{},'Anciens éléments sur le téléphone ('+local.length+') — non importés'));local.forEach(x=>old.append(el('p',{class:'muted'},x.text)));p.append(old)}
 }else if(tab==='recipes'){
  const search=el('input',{type:'text',placeholder:'Chercher une recette…'}),results=el('div');p.append(search,results);
  const draw=()=>{results.replaceChildren();pc.recipes.filter(x=>(x.title||'').toLowerCase().includes(search.value.toLowerCase())).slice(0,100).forEach(x=>{const d=el('details',{class:'panel'});d.append(el('summary',{},x.title),el('p',{},x.recipe||x.notes||'Recette enregistrée dans L’Atelier'));results.append(d)})};search.oninput=draw;draw();
 }else if(tab==='notes'){
  const title=el('input',{type:'text',placeholder:'Titre de ma note'}),cat=el('select');
  ['JDR','Journal','Général','Communication'].forEach(x=>cat.append(el('option',{value:x},x)));
  const body=el('textarea',{placeholder:'Une idée que je pourrai copier et envoyer…'}),btn=el('button',{class:'action'},'Enregistrer sur mon PC');
  btn.onclick=async()=>{if(!body.value.trim())return;try{const latest=await callPc('GET','/api/mobile/notes');const note={id:'apk-'+Date.now()+'-'+Math.random().toString(36).slice(2),title:title.value.trim()||'Sans titre',category:cat.value,content:body.value,updated:new Date().toISOString()};await callPc('POST','/api/mobile/notes',{notes:[...latest,note]});await syncPull()}catch(e){alert('Enregistrement non confirmé : '+e.message)}};
  p.append(title,cat,body,btn);
  pc.notes.slice().reverse().forEach(n=>{const d=el('details',{class:'panel'}),text=el('p',{},n.content);d.append(el('summary',{},'['+n.category+'] '+n.title),text);p.append(d)});
 }else if(tab==='calendar'){
  const modes=el('div',{class:'arrows'});
  [['month','Mois'],['week','Semaine'],['day','Jour']].forEach(([k,t])=>{const b=el('button',{},(calendarView===k?'● ':'')+t);b.onclick=()=>{calendarView=k;render()};modes.append(b)});p.append(modes);
  const change=el('div',{class:'arrows'}),prev=el('button',{},'←'),next=el('button',{},'→'),label=el('span',{},selected.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}));
  const move=n=>{const d=new Date(selected);if(calendarView==='month')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+n*(calendarView==='week'?7:1));selected=d;syncPull()};
  prev.onclick=()=>move(-1);next.onclick=()=>move(1);change.append(prev,label,next);p.append(change);
  const events=pc.events.filter(e=>{
   const d=String(e.instance_date||e.event_date||'').slice(0,10),a=isoDay(selected);
   if(calendarView==='day')return d===a;
   if(calendarView==='month')return d.startsWith(a.slice(0,7));
   const date=new Date(d+'T12:00:00'),begin=new Date(selected);begin.setDate(begin.getDate()-(begin.getDay()+6)%7);begin.setHours(0,0,0,0);const end=new Date(begin);end.setDate(end.getDate()+7);return date>=begin&&date<end;
  });
  events.sort((a,b)=>String(a.instance_date||a.event_date).localeCompare(String(b.instance_date||b.event_date))).forEach(e=>p.append(el('div',{class:'item'},(e.instance_date||e.event_date)+' — '+(e.start_time||'')+' '+e.title)));
  if(!events.length)p.append(el('p',{class:'muted'},'Aucun rendez-vous pour cette période.'));
  const date=el('input',{type:'date'});date.value=isoDay(selected);const title=el('input',{type:'text',placeholder:'Nouveau rendez-vous'}),btn=el('button',{class:'action'},'Ajouter au calendrier du PC');
  btn.onclick=()=>{if(title.value.trim()&&date.value)syncWrite('POST','/api/events',{title:title.value.trim(),event_date:date.value})};
  p.append(date,title,btn);
 }
}

/* One native APK, two themes, same local storage key and bundled WebView origin. */
const themeKey='goblin-mobile-theme-v1';
function applyTheme(value){const theme=value==='classic'?'classic':'dark';document.body.classList.toggle('theme-classic',theme==='classic');localStorage.setItem(themeKey,theme);document.querySelectorAll('[name="goblinTheme"]').forEach(r=>r.checked=r.value===theme)}
applyTheme(localStorage.getItem(themeKey)||'dark');
const personalCardKey='goblin-mobile-communication-cards-v1';
const standardCards=['J’ai besoin d’un moment au calme.','J’ai du mal à trouver mes mots. Je préfère écrire.','Je ne peux pas continuer cette conversation maintenant.','J’ai besoin que tu restes près de moi sans me poser de questions.'];
function toolsView(root){
 const intro=panel(root,'☆ Ma boîte à outils');
 intro.append(el('p',{class:'muted'},'Tu peux choisir ce qui te fait du bien. Rien n’est obligatoire.'));
 const grounding=el('div',{class:'tool-card'});grounding.append(el('h3',{},'🌿 Revenir au présent'),el('p',{},'Si tu le souhaites, observe cinq choses autour de toi, ressens quatre contacts et écoute trois sons. Tu peux arrêter quand tu veux.'));intro.append(grounding);
 const pause=el('div',{class:'tool-card'});pause.append(el('h3',{},'🫧 Une pause douce'),el('p',{},'Assieds-toi confortablement, prends appui sur une surface stable et laisse ta respiration suivre son rythme naturel.'));intro.append(pause);
 const comm=el('div',{class:'tool-card'});comm.append(el('h3',{},'💬 Cartes de communication'));
 let cards=[];try{cards=JSON.parse(localStorage.getItem(personalCardKey)||'[]');if(!Array.isArray(cards))cards=[]}catch(e){}
 for(const t of [...standardCards,...cards]){const btn=el('button',{class:'action'},t);btn.onclick=async()=>{try{await navigator.clipboard.writeText(t);alert('Carte copiée !')}catch(e){prompt('Copie cette carte :',t)}};comm.append(btn)}
 const add=el('button',{class:'action'},'＋ Ma propre carte');add.onclick=()=>{const value=prompt('Quel message voudrais-tu garder à portée de main ?');if(!value?.trim())return;cards.push(value.trim().slice(0,500));localStorage.setItem(personalCardKey,JSON.stringify(cards.slice(-30)));render()};comm.append(add);intro.append(comm);
 const diary=el('div',{class:'tool-card'});diary.append(el('h3',{},'📓 Journal et idées'));
 const goJournal=el('button',{class:'action'},'Mon journal');goJournal.onclick=()=>{state.page='journal';save();render()};
 const goNote=el('button',{class:'action'},'Une note JDR pour ChatGPT');goNote.onclick=()=>{state.page='connected';tab='notes';save();render()};diary.append(goJournal,goNote);intro.append(diary);
}
window.__atelierBackupComplete=success=>alert(success?'Sauvegarde enregistrée. Conserve ce fichier dans un endroit sûr.':'Sauvegarde annulée ou impossible. Aucune donnée modifiée.');
function backupSettings(root){
 const p=panel(root,'Sauvegarder mes données du téléphone');
 p.append(el('p',{class:'muted'},'Avant toute mise à jour Android, exporte ton journal, tes habitudes, tes tâches, tes pensées et tes anciens rendez-vous. Ce fichier peut contenir des données personnelles : garde-le privé.'));
 const button=el('button',{class:'action'},'💾 Exporter mes données Android');
 button.onclick=()=>{const payload={format:'atelier-goblin-android-backup-v1',createdAt:new Date().toISOString(),state,personalCards:localStorage.getItem(personalCardKey)||'[]',theme:localStorage.getItem(themeKey)||'dark'};const json=JSON.stringify(payload);if(window.AtelierBackup?.exportBackup){window.AtelierBackup.exportBackup(json)}else{const ta=el('textarea');ta.value=json;p.append(ta);ta.focus();ta.select();alert('Export natif absent : copie ce texte et conserve-le dans un fichier JSON privé.')}};
 p.append(button);
}
function themeSettings(root){
 const p=panel(root,'Apparence de mon Atelier');p.append(el('p',{class:'muted'},'Choisis ton ambiance. Le thème Goblin sombre est proposé par défaut.'));
 const group=el('div',{class:'theme-choice'});
 for(const [value,title] of [['dark','🌲 Goblin sombre'],['classic','🌿 Classique vert et crème']]){const label=el('label');const radio=el('input',{type:'radio',name:'goblinTheme',value});radio.checked=(localStorage.getItem(themeKey)||'dark')===value;radio.onchange=()=>applyTheme(value);label.append(radio,el('span',{},title));group.append(label)}p.append(group);
}
function updateNav(){document.querySelectorAll('[data-mobile-go]').forEach(b=>{const dest=b.dataset.mobileGo,section=b.dataset.mobileSection;b.classList.toggle('active',dest===state.page&&(dest!=='connected'||(section==='notes'?tab==='notes':tab==='calendar')))})}
document.querySelectorAll('[data-mobile-go]').forEach(btn=>btn.onclick=()=>{state.page=btn.dataset.mobileGo;if(state.page==='connected')tab=btn.dataset.mobileSection==='notes'?'notes':'calendar';save();document.getElementById('nav').hidden=true;render();window.scrollTo(0,0)});

const previousRender=render;
render=function(){
 if(state.page==='tools'){document.getElementById('title').textContent='Mes outils';document.getElementById('subtitle').textContent='Un espace à mon rythme 🌿';const root=document.getElementById('content');root.replaceChildren();toolsView(root);updateNav();return}
 if(state.page==='connected'){document.getElementById('title').textContent='Mon Atelier synchronisé';document.getElementById('subtitle').textContent='Mes données du PC, mes habitudes à moi.';const root=document.getElementById('content');root.replaceChildren();connectedView(root);updateNav();return}
 previousRender();
 if(state.page==='settings'){backupSettings(document.getElementById('content'));connectedSettings(document.getElementById('content'));themeSettings(document.getElementById('content'))}updateNav();
};
render();
if(pcUrl)syncPull();

</script></body></html>
