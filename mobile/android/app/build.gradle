plugins { id 'com.android.application' }

def releaseVersion = System.getenv('RELEASE_VERSION')
def parts = releaseVersion ? releaseVersion.tokenize('.').collect { it as int } : [0,1,3]
if (parts.size() != 3 || parts.any { it < 0 || it > 99 }) throw new GradleException('Version must be X.Y.Z with each part 0..99')
def signedBuild = System.getenv('ATELIER_SIGNING_FILE') != null

android {
    namespace 'fr.atelierdugoblin.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.atelierdugoblin.mobile'
        minSdk 26
        targetSdk 35
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName releaseVersion ?: '0.1.3-test'
    }
    signingConfigs {
        atelierRelease {
            if (signedBuild) {
                storeFile file(System.getenv('ATELIER_SIGNING_FILE'))
                storePassword System.getenv('ATELIER_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('ATELIER_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('ATELIER_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signedBuild) signingConfig signingConfigs.atelierRelease
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
