name: Windows TEST manual cycle tracking
on:
  push:
    branches: [test/cycle-manual-20261124]
permissions:
  contents: read
jobs:
  cycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/release_smoke.py
      - run: python -m unittest discover -s tools -p 'test_cycle_manual.py'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --only-shell chromium
      - run: node tools/cycle_manual_browser_test.cjs
      - run: node tools/cycle_compact_browser_test.cjs
      - run: node tools/workspace_coherence_browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-manual-${{ matrix.os }}
          path: artifacts/
