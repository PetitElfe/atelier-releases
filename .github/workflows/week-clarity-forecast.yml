name: L'Atelier — semainier lisible et prévisions du cycle
on:
  push:
    branches: [feature/0180-week-clarity-cycle-forecast-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and SHA-256
        run: |
          node --check app/public/app_part2.js
          node --check app/public/app_part3.js
          node --check app/public/calendar_cycle_compact.js
          python -m compileall -q app tests tools
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('manifest.json').read_text())
          for item in m['files']:
              path=pathlib.Path('app')/item['path']
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              print('RAW_HASH',item['path'],digest,'OK' if digest==item['sha256'] else 'MISMATCH')
          for rel in ['public/week_clarity.css']:
              path=pathlib.Path('app')/rel
              print('RAW_HASH',rel,hashlib.sha256(path.read_bytes()).hexdigest(),'NEW')
          PY
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Release smoke
        run: python tools/release_smoke.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --only-shell chromium
      - name: New week and cycle tests
        run: |
          node tools/week_clarity_forecast_browser_test.cjs
          node tools/cycle_compact_browser_test.cjs
      - name: Existing feature regression
        run: |
          node tools/preparation_browser_test.cjs
          node tools/objective_map_browser_test.cjs
          node tools/library_browser_test.cjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Windows isolated updater
        shell: pwsh
        run: ./tools/windows_updater_test.ps1
      - name: Both editions bundle new CSS and JS
        shell: pwsh
        run: |
          python tools/build_nathan_bundle.py
          python -c "import pathlib; p=pathlib.Path('build/nathan_code/app/public'); assert (p/'week_clarity.css').is_file(); assert (p/'calendar_cycle_compact.js').is_file(); print('PASS: both editions contain new calendar')"
