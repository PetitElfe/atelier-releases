name: L’Atelier du Goblin — Nathan private Windows app

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/nathan_launcher.py"
      - "tools/nathan_patch.py"
      - "tools/build_nathan_bundle.py"
      - ".github/workflows/nathan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-nathan:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "pywebview==6.2.1" "pyinstaller>=6.16,<7" "pillow>=11,<13"
      - name: Create independently configured source with verified hashes
        shell: pwsh
        run: |
          python -m py_compile tools/nathan_launcher.py tools/nathan_patch.py tools/build_nathan_bundle.py
          python tools/build_nathan_bundle.py
          python -c "import sys;sys.path.insert(0,'build/nathan_code/app');import updater,desktop_postits;assert updater.PORT==8877 and desktop_postits.DATA.name=='data' and 'LAtelierDuGoblinNathan' in str(updater.BASE);print('PASS: independent Nathan paths')"
      - name: Build bundled Windows EXE including its own Python runtime and app
        shell: pwsh
        run: |
          python tools/create_desktop_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LAtelierDuGoblin_Nathan --icon build/atelier.ico --version-file tools/windows_version_info.txt --add-data "build/nathan_code;nathan_code" --hidden-import webview.platforms.winforms --hidden-import http.server --hidden-import urllib.parse --hidden-import urllib.request --hidden-import http.client --hidden-import sqlite3 --hidden-import tkinter --hidden-import tkinter.messagebox --hidden-import calendar --hidden-import email.mime --hidden-import xml.etree.ElementTree --hidden-import mimetypes --hidden-import ipaddress --hidden-import ctypes.wintypes --hidden-import zipfile --hidden-import hashlib --hidden-import socketserver tools/nathan_launcher.py
          if (-not (Test-Path dist/LAtelierDuGoblin_Nathan.exe)) { throw "Nathan exe missing" }
          if ((Get-Item dist/LAtelierDuGoblin_Nathan.exe).Length -lt 4000000) { throw "Nathan exe unexpectedly small" }
      - name: Verify frozen exe and isolated install in disposable LOCALAPPDATA
        shell: pwsh
        run: |
          $work=Join-Path $env:RUNNER_TEMP "nathan-isolation-test"
          New-Item -ItemType Directory -Force $work | Out-Null
          $env:LOCALAPPDATA=$work
          $p=Start-Process -FilePath (Resolve-Path "dist/LAtelierDuGoblin_Nathan.exe") -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Nathan exe self-test failed" }
          # Verify no files are copied into the original TEST or stable paths:
          if (Test-Path (Join-Path $work "LAtelierDuGoblinNathan\data\atelier.db")) {
            throw "The self-test should not create Nathan data"
          }
          python -c "import sys;sys.path.insert(0,'build/nathan_code/app');import nathan_patch;assert nathan_patch.PORT==8877;print('PASS: Nathan patcher')"
          Write-Host "PASS: Nathan bundle is separate; user's real Windows GUI needs human test"
      - name: Instructions
        shell: pwsh
        run: |
          @'
          L'ATELIER DU GOBLIN — NATHAN (BÊTA PERSONNELLE)

          Ceci est une NOUVELLE application, indépendante de la version TEST.
          Sur le PC de Nathan : extraire le ZIP, ouvrir LAtelierDuGoblin_Nathan.exe.
          L'application s'installera pour son compte Windows (sans administrateur)
          dans %LOCALAPPDATA%\LAtelierDuGoblinNathan.
          Sa base SQLite est créée NEUVE au premier démarrage. Il n'y a aucune
          copie des données d'un autre ordinateur ni d'un autre profil Windows.
          Raccourci Bureau : "L'Atelier du Goblin - Nathan".
          Port local 8877. La version stable et le TEST sur E: ne sont pas lus.
          Python est inclus dans ce .exe. Windows WebView2 est nécessaire.

          Paramètres : une pastille dorée informe des nouvelles révisions TEST.
          Les mises à jour demandent confirmation et créent une sauvegarde.
          Toute première installation reste à valider sur le véritable PC Nathan.
          NE PAS copier de dossier « data » ou de bases SQLite depuis quelqu'un.
          L'exécutable n'est pas signé : SmartScreen peut signaler Éditeur inconnu.
          '@ | Set-Content build/LIRE_NATHAN.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: LAtelierDuGoblin_Nathan_Windows_BETA
          path: |
            dist/LAtelierDuGoblin_Nathan.exe
            build/LIRE_NATHAN.txt
          if-no-files-found: error
          retention-days: 14
