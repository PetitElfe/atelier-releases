name: Android mobile signed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z (example: 0.1.0)'
        required: true
        default: '0.1.3'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ATELIER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ATELIER_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATELIER_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATELIER_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || { echo "::error::Missing Android signing secrets. See mobile/RELEASE_CHECKLIST.md"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/atelier-release.jks"
          echo "ATELIER_SIGNING_FILE=$RUNNER_TEMP/atelier-release.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate version and bundle UI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$RELEASE_VERSION" != "0.1.0" && test "$RELEASE_VERSION" != "0.1.1" || { echo "::error::Version already published; choose 0.1.2 or higher"; exit 1; }
          mkdir -p mobile/android/app/src/main/assets
          cp mobile/prototype/index.html mobile/android/app/src/main/assets/index.html
      - name: Build signed APK
        working-directory: mobile/android
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ATELIER_SIGNING_FILE: ${{ env.ATELIER_SIGNING_FILE }}
          ATELIER_SIGNING_STORE_PASSWORD: ${{ secrets.ATELIER_ANDROID_STORE_PASSWORD }}
          ATELIER_SIGNING_KEY_PASSWORD: ${{ secrets.ATELIER_ANDROID_KEY_PASSWORD }}
          ATELIER_SIGNING_KEY_ALIAS: ${{ secrets.ATELIER_ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature and package
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          mv "$APK" LAtelierDuGoblin-Mobile.apk
          sha256sum LAtelierDuGoblin-Mobile.apk > LAtelierDuGoblin-Mobile.apk.sha256
      - name: Confirm signature matches the already installed Android 0.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous-android"
          gh release download android-v0.1.1 --pattern 'LAtelierDuGoblin-Mobile.apk' --dir "$RUNNER_TEMP/previous-android"
          OLD="$RUNNER_TEMP/previous-android/LAtelierDuGoblin-Mobile.apk"
          NEW="LAtelierDuGoblin-Mobile.apk"
          test -s "$OLD" && test -s "$NEW"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$OLD"
          "$APKSIGNER" verify --verbose "$NEW"
          get_cert() {
            "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1
          }
          OLD_CERT="$(get_cert "$OLD")"
          NEW_CERT="$(get_cert "$NEW")"
          test -n "$OLD_CERT" && test -n "$NEW_CERT"
          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "::error::Android signing certificate differs from v0.1.1. Existing app must NOT be replaced."
            exit 1
          fi
          echo "Release signing certificate matches the existing v0.1.1 release."
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          OLD_CODE=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: .*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          NEW_CODE=$("$AAPT" dump badging "$NEW" | sed -n "s/^package: .*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          test -n "$OLD_CODE" && test -n "$NEW_CODE"
          if [ "$NEW_CODE" -le "$OLD_CODE" ]; then
            echo "::error::Android versionCode must be higher than the installed release."
            exit 1
          fi
          echo "Android versionCode upgrade verified: $OLD_CODE -> $NEW_CODE."
      - uses: actions/upload-artifact@v4
        with:
          name: LAtelierDuGoblin_Android_Signed
          path: |
            LAtelierDuGoblin-Mobile.apk
            LAtelierDuGoblin-Mobile.apk.sha256
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "android-v$RELEASE_VERSION" LAtelierDuGoblin-Mobile.apk LAtelierDuGoblin-Mobile.apk.sha256 --title "L'Atelier du Goblin Android v$RELEASE_VERSION" --notes "Version Android signée. Les futures mises à jour exigent le même certificat."
