name: Windows desktop TEST app

on:
  pull_request:
    branches: [main]
    paths:
      - "app/desktop_shell.py"
      - "tools/create_desktop_icon.py"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-test-app:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install native shell and packaging
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pywebview==6.2.1" "pyinstaller>=6.16,<7" "pillow>=11,<13"
      - name: Verify source and generate multi-resolution ICO
        shell: pwsh
        run: |
          python -m py_compile app/desktop_shell.py tools/create_desktop_icon.py
          python app/desktop_shell.py --self-test
          python tools/create_desktop_icon.py
      - name: Package real Windows EXE without browser chrome
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LAtelier_TEST --icon build/atelier.ico --hidden-import webview.platforms.winforms app/desktop_shell.py
          if (-not (Test-Path dist/LAtelier_TEST.exe)) { throw "Windows executable missing" }
          if ((Get-Item dist/LAtelier_TEST.exe).Length -lt 1000000) { throw "Executable unexpectedly small" }
      - name: Verify executable entrypoint
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/LAtelier_TEST.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The packaged EXE fails its self-test: $($p.ExitCode)" }
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "dist/LAtelier_TEST.exe"))
          if ($null -eq $ico) { throw "The executable icon is missing." }
          Write-Host "PASS: native Windows executable and icon"
      - name: Prepare use instructions
        shell: pwsh
        run: |
          @'
          L'ATELIER WINDOWS TEST 0.18.0

          1. Keep your existing TEST installation in E:\LATELIER_TEST_0180.
          2. Double-click LAtelier_TEST.exe once from the extracted ZIP.
          3. It checks your TEST data, installs itself under
             E:\LATELIER_TEST_0180\desktop\LAtelier_TEST.exe,
             creates "L'Atelier TEST" on your Windows Desktop and opens
             L'Atelier in its own WebView2 window (no Brave tab).
          4. The current TEST Python server and its updates are reused.
          5. Your old Brave localStorage (interface preferences) is not
             automatically transferred into the new WebView2 profile.
             All SQLite application data remains in the TEST data folder.

          This build is unsigned: Windows may display a SmartScreen warning.
          Download only from this project's verified CI build.
          NEVER use it with E:\00_LATELIER (stable 0.17.0).

          Post-it on the Windows Desktop is a separate feature, not included
          in this first native-window shell.
          '@ | Set-Content build/LIRE_AVANT_INSTALLATION.txt -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: LAtelier_TEST_Windows_EXE_icone
          path: |
            dist/LAtelier_TEST.exe
            build/atelier.ico
            build/LIRE_AVANT_INSTALLATION.txt
          if-no-files-found: error
          retention-days: 14
