name: Android TEST upgrade from installed 0.1.5 to 0.1.10
on:
  push:
    branches: [test/mental-star-gesture-20261102]
    paths:
      - '.github/test-releases/verify-015-to-020.txt'
permissions:
  contents: read
jobs:
  verify-015-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Download prior signed 0.1.5 and TEST prerelease 0.1.10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old-015" "$RUNNER_TEMP/new-020"
          gh run download 41164449516 --repo "${{ github.repository }}" --name LAtelierDuGoblin_Android_015_Signed_TEST --dir "$RUNNER_TEMP/old-015"
          gh release download android-test-v0.1.10 --repo "${{ github.repository }}" --pattern LAtelierDuGoblin-Mobile.apk --pattern LAtelierDuGoblin-Mobile.apk.sha256 --dir "$RUNNER_TEMP/new-020"
          test -s "$RUNNER_TEMP/old-015/app-release.apk"
          test -s "$RUNNER_TEMP/new-020/LAtelierDuGoblin-Mobile.apk"
          (cd "$RUNNER_TEMP/new-020" && sha256sum --check LAtelierDuGoblin-Mobile.apk.sha256)
      - name: Verify package identity, signing certificate, and increasing version code
        shell: bash
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/old-015/app-release.apk"
          NEW="$RUNNER_TEMP/new-020/LAtelierDuGoblin-Mobile.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$OLD"
          "$APKSIGNER" verify --verbose "$NEW"
          old_cert=$("$APKSIGNER" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          new_cert=$("$APKSIGNER" verify --print-certs "$NEW" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          old_pkg=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          new_pkg=$("$AAPT" dump badging "$NEW" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          test "$old_pkg" = 'fr.atelierdugoblin.mobile'
          test "$old_pkg" = "$new_pkg"
          "$AAPT" dump badging "$OLD" | grep -q "versionCode='105'"
          "$AAPT" dump badging "$NEW" | grep -q "versionCode='110'"
          echo "PASS: same signed application, version 0.1.5 (105) -> 0.1.10 (110)."
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Test direct signed Android replacement on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 720
          script: |
            adb install -r "$RUNNER_TEMP/old-015/app-release.apk"
            adb shell am start -n fr.atelierdugoblin.mobile/.MainActivity
            adb shell am force-stop fr.atelierdugoblin.mobile
            adb install -r "$RUNNER_TEMP/new-020/LAtelierDuGoblin-Mobile.apk"
            adb shell am start -n fr.atelierdugoblin.mobile/.MainActivity
            sleep 12
            adb shell pidof fr.atelierdugoblin.mobile
            adb logcat -d -s AndroidRuntime:E | tee /tmp/goblin-015-to-020-crashes.log
            ! grep -q 'FATAL EXCEPTION' /tmp/goblin-015-to-020-crashes.log
