name: L'Atelier — validation

on:
  pull_request:
    branches: [main, feature/0180-progression-foundations]
  push:
    branches: [main, feature/0180-progression-foundations]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app/public/app_part1.js
          node --check app/public/app_part2.js
          node --check app/public/app_part3.js
          node --check app/public/postits.js
          node --check app/public/objective_map.js
          node --check app/public/progression_view.js
          node --check app/public/standalone_preparations.js
          node --check app/public/life_tools.js
          node --check app/public/tracker_ritual_ui.js

      - name: Vérifier les tests des nouveaux modules
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Vérifier les Post-it indépendants et la protection des écritures
        run: |
          python app/desktop_postits.py --self-test
          python app/windows_tray.py

      - name: Vérifier la sauvegarde et l'installateur TEST isolé
        run: python tools/update_smoke.py

      - name: Vérifier la release et démarrer L'Atelier
        run: python tools/release_smoke.py

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright
          # Les bibliothèques graphiques de l'agent Ubuntu suffisent pour l'exécution headless.
          # Éviter apt-get --with-deps (très lent, timeout de 10 min avant les tests).
          npx playwright install --only-shell chromium
      - name: Verify calendar creation and weekly appointment contrast
        run: node tools/calendar_priority_browser_test.cjs
      - name: Verify expanded upcoming appointments above the journal
        run: node tools/home_upcoming_overlay_browser_test.cjs
      - name: Verify tracker duplication, drag order and calendar visual redesign
        run: node tools/big_refonte_browser_test.cjs
      - name: Verify native macro launcher in temporary data
        run: python app/quick_capture_macro.py --self-test
      - name: Verify tracker habits with targets, steps, weekly day rules and Settings archives
        run: node tools/tracker_ritual_browser_test.cjs
      - name: Verify preserved old preparatives and daily Home checkboxes
        run: node tools/preparations_tracker_home_browser_test.cjs
      - name: Reproduce Accueil after refresh, drawer and edit mode
        run: node tools/home_refresh_browser_test.cjs
      - name: Reproduce save / Accueil / return
        run: |
          node tools/objective_map_browser_test.cjs
          node tools/library_browser_test.cjs

  windows-self-update:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tester sur Windows la mise à jour TEST en un clic
        shell: pwsh
        run: ./tools/windows_updater_test.ps1

      - name: Tester les Post-it natifs Windows sans fenêtre
        shell: pwsh
        run: |
          python app/desktop_postits.py --self-test
          python app/windows_tray.py
          python -m py_compile app/desktop_postits.py app/windows_tray.py
          python -c "import tkinter; print('PASS: Windows Tkinter available')"
