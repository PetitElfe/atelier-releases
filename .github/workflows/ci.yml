name: L'Atelier — validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app/public/app_part1.js
          node --check app/public/app_part2.js
          node --check app/public/app_part3.js
          node --check app/public/objective_map.js
          node --check app/public/progression_view.js

      - name: Vérifier les tests des nouveaux modules
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Vérifier la release et démarrer L'Atelier
        run: python tools/release_smoke.py

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Reproduce save / Accueil / return
        run: |
          node tools/objective_map_browser_test.cjs
          node tools/library_browser_test.cjs
