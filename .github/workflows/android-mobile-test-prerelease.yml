name: Android TEST prerelease 0.1.11 (isolated)
on:
  push:
    branches: [test/mental-star-gesture-20261102]
    paths:
      - '.github/test-releases/publish-android-test-021.txt'
permissions:
  contents: write
concurrency:
  group: goblin-android-test-021
  cancel-in-progress: false
jobs:
  signed-test-prerelease:
    if: github.repository == 'PetitElfe/atelier-releases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify UI logic and journal synchronization before publishing
        shell: bash
        run: |
          node --test tests/mental_sync_race.test.cjs
          node --test tests/mobile_auto_backup.test.cjs
          node --test tests/mobile_navigation_notes.test.cjs
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('mobile/prototype/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/);
          assert(script,'Mobile JavaScript was not bundled');
          new Function(script[1]);
          for(const part of ['goblinUpdateChannel()', "id:'goblinUpdateChannel'", 'window.AtelierUpdates.setUpdateChannel', 'starTravel>=55', "const mentalKey='goblin-mobile-mental-v1'"]){
            assert(html.includes(part),part+' missing');
          }
          const backup=fs.readFileSync('mobile/android/app/src/main/java/fr/atelierdugoblin/mobile/AutoBackupBridge.java','utf8');
          const activity=fs.readFileSync('mobile/android/app/src/main/java/fr/atelierdugoblin/mobile/MainActivity.java','utf8');
          assert(backup.includes('original-before-first-upgrade.json'),'First-launch preservation missing');
          assert(backup.includes('snapshot(String payload, String reason)'),'Private backup API missing');
          assert(activity.includes('webView.addJavascriptInterface(autoBackupBridge, "AtelierAutoBackup")'),'Native backup unavailable');
          assert(html.includes("goblinSnapshot('startup')"),'First-launch snapshot missing');
          assert(html.includes("goblinSnapshot('pre-update')"),'Pre-update guard missing');
          const native=fs.readFileSync('mobile/android/app/src/main/java/fr/atelierdugoblin/mobile/UpdateBridge.java','utf8');
          for(const part of ['TEST_TAG','currentChannel()','setUpdateChannel(String channel)','release.optBoolean("prerelease") != isTest','generation != channelGeneration','Arrays.equals(signer(target,true), signer(target,false))']){
            assert(native.includes(part),part+' missing');
          }
          console.log('Signed TEST prerequisites: PASS');
          NODE
      - name: Install Android SDK and bundle app
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p mobile/android/app/src/main/assets
          cp mobile/prototype/index.html mobile/android/app/src/main/assets/index.html
      - name: Load permanent signing key without exposing it
        env:
          KEYSTORE_B64: ${{ secrets.ATELIER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ATELIER_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATELIER_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATELIER_ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || exit 1
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/atelier-release.jks"
          echo "ATELIER_SIGNING_FILE=$RUNNER_TEMP/atelier-release.jks" >> "$GITHUB_ENV"
      - name: Build Android TEST 0.1.11 signed with the permanent certificate
        working-directory: mobile/android
        env:
          RELEASE_VERSION: '0.1.11'
          ATELIER_SIGNING_FILE: ${{ env.ATELIER_SIGNING_FILE }}
          ATELIER_SIGNING_STORE_PASSWORD: ${{ secrets.ATELIER_ANDROID_STORE_PASSWORD }}
          ATELIER_SIGNING_KEY_PASSWORD: ${{ secrets.ATELIER_ANDROID_KEY_PASSWORD }}
          ATELIER_SIGNING_KEY_ALIAS: ${{ secrets.ATELIER_ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease
      - name: Verify TEST APK contents, package and versionCode
        shell: bash
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -q "package: name='fr.atelierdugoblin.mobile'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='111'"
          unzip -p "$APK" assets/index.html | grep -q 'goblinUpdateChannel'
          echo 'APK 0.1.11 signed, correctly packaged, and contains the channel selector.'
      - name: Download prior signed 0.1.10 TEST APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/old-020"
          gh run download 41515477019 --repo "${{ github.repository }}" --name LAtelierDuGoblin_Android_020_Signed_TEST --dir "$RUNNER_TEMP/old-020"
          test -s "$RUNNER_TEMP/old-020/LAtelierDuGoblin-Mobile.apk"
      - name: Match Android identity, signer, and 0.1.10 to 0.1.11 upgrade
        shell: bash
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/old-020/LAtelierDuGoblin-Mobile.apk"
          NEW=mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$OLD"
          "$APKSIGNER" verify --verbose "$NEW"
          old_cert=$("$APKSIGNER" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          new_cert=$("$APKSIGNER" verify --print-certs "$NEW" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          "$AAPT" dump badging "$OLD" | grep -q "versionCode='110'"
          "$AAPT" dump badging "$NEW" | grep -q "versionCode='111'"
          echo "PASS: same signer, versionCode 110 -> 111, and stable application ID."
      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Smoke-test signed replacement in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 720
          script: |
            adb install -r "$RUNNER_TEMP/old-020/LAtelierDuGoblin-Mobile.apk"
            adb shell am start -n fr.atelierdugoblin.mobile/.MainActivity
            adb shell am force-stop fr.atelierdugoblin.mobile
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -n fr.atelierdugoblin.mobile/.MainActivity
            sleep 12
            adb shell pidof fr.atelierdugoblin.mobile
            adb logcat -d -s AndroidRuntime:E | tee /tmp/goblin-test-021-crashes.log
            ! grep -q 'FATAL EXCEPTION' /tmp/goblin-test-021-crashes.log
      - name: Publish signed prerelease ONLY from this TEST branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-test-v0.1.11"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::TEST prerelease tag already exists; refusing to overwrite."
            exit 1
          fi
          cp mobile/android/app/build/outputs/apk/release/app-release.apk LAtelierDuGoblin-Mobile.apk
          sha256sum LAtelierDuGoblin-Mobile.apk > LAtelierDuGoblin-Mobile.apk.sha256
          gh release create "$TAG" LAtelierDuGoblin-Mobile.apk LAtelierDuGoblin-Mobile.apk.sha256 \
            --repo "${{ github.repository }}" \
            --title "Goblin Android TEST 0.1.11 (préversion)" \
            --notes "Correctifs TEST Android : boutons et pages opérationnels, étoile ouvrant la respiration, Notes générales classées avec #hashtags. Sauvegardes locales conservées. Certificat APK et SHA-256 vérifiés, consentement Android obligatoire. Branche TEST uniquement, pas de fusion sur main." \
            --prerelease --target "$GITHUB_SHA"
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,isPrerelease,url
      - uses: actions/upload-artifact@v4
        with:
          name: LAtelierDuGoblin_Android_021_Signed_TEST
          path: |
            LAtelierDuGoblin-Mobile.apk
            LAtelierDuGoblin-Mobile.apk.sha256
          retention-days: 14
          if-no-files-found: error
