name: Shopping and universal layout TEST
on:
  push:
    branches: [test/shopping-misu-20261112, test/shopping-nathan-20261112]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/release_smoke.py
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --only-shell chromium
      - run: node tools/layout_all_sections_browser_test.cjs
      - run: node tools/display_preferences_browser_test.cjs
      - run: node tools/studio_browser_test.cjs
      - run: node tools/budget_refinement_browser_test.cjs
      - run: node tools/cycle_compact_browser_test.cjs
      - run: node tools/tracker_schedule_order_browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shopping_layout_evidence
          path: artifacts/
          if-no-files-found: ignore
