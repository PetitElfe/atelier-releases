name: Android mobile prototype APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'feature/mobile-usability-backup-20261027']
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile-prototype.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile-prototype.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Test isolated LAN sync server (no personal data)\n        run: python3 -m unittest discover -s mobile/sync/tests -v\n      - name: Bundle offline journal UI
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp mobile/prototype/index.html mobile/android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package and bundled journal
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='fr.atelierdugoblin.mobile'"
      - name: Boot Android emulator and smoke-test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            # Ephemeral CI emulator: bypass Play Protect network verification
            # (it can time out without Google services; does not affect APK security).
            adb shell settings put global package_verifier_enable 0
            adb shell settings put global verifier_verify_adb_installs 0
            adb install -r -t mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n fr.atelierdugoblin.mobile/.MainActivity
            sleep 12
            adb shell pidof fr.atelierdugoblin.mobile
            adb logcat -d -s AndroidRuntime:E | tee /tmp/atelier-crashes.log
            ! grep -q 'FATAL EXCEPTION' /tmp/atelier-crashes.log
      - uses: actions/upload-artifact@v4
        with:
          name: LAtelierDuGoblin_Android_Prototype_APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
