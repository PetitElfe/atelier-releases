name: Android mobile prototype APK
on:
  workflow_dispatch:
  pull_request:
    branches: [feature/0180-progression-foundations]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile-prototype.yml'
  push:
    branches: [feature/android-goblin-mobile]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile-prototype.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle offline journal UI
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp mobile/prototype/index.html mobile/android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LAtelierDuGoblin_Android_Prototype_APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
