name: Android mobile prototype APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile-prototype.yml'
  push:
    branches: [main, feature/mobile-journal-navigation-20261027]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile-prototype.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle offline journal UI
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp mobile/prototype/index.html mobile/android/app/src/main/assets/index.html
      - name: Validate HTML and mobile migration safety
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const html=fs.readFileSync('mobile/prototype/index.html','utf8');
          const match=html.match(/<script>([\s\S]*?)<\/script>/);
          assert(match,'Application JavaScript absent');
          new Function(match[1]);
          assert(html.includes("const KEY='goblin-mobile-prototype-v1'"),'Historic localStorage identifier changed');
          assert(html.includes('body.theme-classic'),'Classic theme absent');
          assert(html.includes("applyTheme(localStorage.getItem(themeKey)||'dark')"),'Goblin default changed');
          assert(html.includes('data-mobile-section="notes"'),'JDR notes tab absent');
          assert(html.includes('id="mobileTabs"'),'Mobile navigation absent');
          assert(html.includes('window.AtelierBackup.exportBackup'),'Backup UI absent');
          assert(html.includes('window.AtelierTailnet.request'),'Tailscale bridge absent');
          const gradle=fs.readFileSync('mobile/android/app/build.gradle','utf8');
          assert(gradle.includes("applicationId 'fr.atelierdugoblin.mobile'"),'Package identifier changed');
          assert(gradle.includes(' : [0,1,2]'),'Test version code unexpectedly changed');
          const main=fs.readFileSync('mobile/android/app/src/main/java/fr/atelierdugoblin/mobile/MainActivity.java','utf8');
          assert(main.includes('Intent.ACTION_CREATE_DOCUMENT'),'Android backup export missing');
          assert(main.includes('webView.loadUrl("https://appassets.androidplatform.net/assets/index.html")'),'App origin changed, historic WebView storage at risk');
          console.log('JS syntax, legacy storage, UI tabs, backup, bridge and package: PASS');
          NODE
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK package and bundled journal
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='fr.atelierdugoblin.mobile'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='102'"
          unzip -p "$APK" assets/index.html | grep -q 'data-mobile-section="notes"'
      - name: Build baseline Android debug APK for non-destructive upgrade test
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/atelier-previous" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/atelier-previous/mobile/android/app/src/main/assets"
          cp "$RUNNER_TEMP/atelier-previous/mobile/prototype/index.html" "$RUNNER_TEMP/atelier-previous/mobile/android/app/src/main/assets/index.html"
          gradle --no-daemon -p "$RUNNER_TEMP/atelier-previous/mobile/android" assembleDebug
          test -s "$RUNNER_TEMP/atelier-previous/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Enable KVM acceleration for Android emulator
        run: |
          # GitHub-hosted images often have no udev daemon.
          # Set permissions on the existing KVM device directly instead.
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "::warning::/dev/kvm unavailable; emulator will use slower software acceleration"
          fi
      - name: Boot Android emulator and smoke-test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-boot-timeout: 720
          script: |
            # Ephemeral CI emulator: bypass Play Protect network verification
            # (it can time out without Google services; does not affect APK security).
            adb shell settings put global package_verifier_enable 0
            adb shell settings put global verifier_verify_adb_installs 0
            # android-emulator-runner invokes each script line with a separate sh -c.
            # Keep the APK path in the install invocation instead of a shell variable.
            adb install -r -t "$RUNNER_TEMP/atelier-previous/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell run-as fr.atelierdugoblin.mobile mkdir -p files
            adb shell run-as fr.atelierdugoblin.mobile touch files/upgrade-sentinel.txt
            # Both debug APKs use the same CI-generated debug signer. This proves
            # only the local upgrade path; NOT compatibility with the user's signed APK.
            adb install -r -t mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as fr.atelierdugoblin.mobile ls files/upgrade-sentinel.txt
            adb shell am start -n fr.atelierdugoblin.mobile/.MainActivity
            sleep 12
            adb shell pidof fr.atelierdugoblin.mobile
            adb logcat -d -s AndroidRuntime:E | tee /tmp/atelier-crashes.log
            ! grep -q 'FATAL EXCEPTION' /tmp/atelier-crashes.log
      - uses: actions/upload-artifact@v4
        with:
          name: LAtelierDuGoblin_Android_Prototype_APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
