name: Display preferences desktop TEST
on:
  push:
    branches: [test/display-misu-20261112, test/display-nathan-20261112]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/release_smoke.py
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --only-shell chromium
      - run: node tools/display_preferences_browser_test.cjs
      - run: node tools/recipe_shelves_browser_test.cjs
      - run: node tools/budget_opening_browser_test.cjs
      - run: node tools/tracker_schedule_order_browser_test.cjs
      - run: node tools/cycle_compact_browser_test.cjs
      - run: node tools/week_clarity_forecast_browser_test.cjs
      - run: node tools/studio_browser_test.cjs
