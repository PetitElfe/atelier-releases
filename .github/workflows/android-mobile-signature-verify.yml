name: Android verify existing APK upgrade signature
on:
  workflow_dispatch:
  push:
    branches: [feature/mobile-journal-navigation-20261027]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile-signature-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ATELIER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ATELIER_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ATELIER_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATELIER_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || { echo "::error::Permanent signing configuration is missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/atelier-release.jks"
          echo "ATELIER_SIGNING_FILE=$RUNNER_TEMP/atelier-release.jks" >> "$GITHUB_ENV"
      - name: Prepare Android and package
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p mobile/android/app/src/main/assets
          cp mobile/prototype/index.html mobile/android/app/src/main/assets/index.html
      - name: Build signed upgrade without publishing
        working-directory: mobile/android
        env:
          RELEASE_VERSION: '0.1.6'
          ATELIER_SIGNING_FILE: ${{ env.ATELIER_SIGNING_FILE }}
          ATELIER_SIGNING_STORE_PASSWORD: ${{ secrets.ATELIER_ANDROID_STORE_PASSWORD }}
          ATELIER_SIGNING_KEY_PASSWORD: ${{ secrets.ATELIER_ANDROID_KEY_PASSWORD }}
          ATELIER_SIGNING_KEY_ALIAS: ${{ secrets.ATELIER_ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease
      - name: Validate certificate and APK upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old"
          gh release download android-v0.1.1 --repo "${{ github.repository }}" --pattern LAtelierDuGoblin-Mobile.apk --dir "$RUNNER_TEMP/old"
          OLD="$RUNNER_TEMP/old/LAtelierDuGoblin-Mobile.apk"
          NEW="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$OLD" && test -s "$NEW"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$OLD"
          "$APKSIGNER" verify --verbose "$NEW"
          old_cert=$("$APKSIGNER" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          new_cert=$("$APKSIGNER" verify --print-certs "$NEW" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test -n "$old_cert" && test -n "$new_cert"
          if [ "$old_cert" != "$new_cert" ]; then
            echo "::error::Certificate mismatch: cannot safely upgrade existing Android APK"
            exit 1
          fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          old_code=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: .*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          new_code=$("$AAPT" dump badging "$NEW" | sed -n "s/^package: .*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)
          test -n "$old_code" && test -n "$new_code"
          test "$new_code" -gt "$old_code" || { echo "::error::Upgrade versionCode is not increasing"; exit 1; }
          old_package=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          new_package=$("$AAPT" dump badging "$NEW" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          test "$old_package" = 'fr.atelierdugoblin.mobile'
          test "$new_package" = "$old_package"
          echo "PASS: same Android package, same SHA-256 signing certificate, higher versionCode."
          echo "This verifies published v0.1.1; installed phone APK must still be checked before upgrade."
      - name: Fetch previous signed Android 0.1.5 test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/old-012"
          gh run download 41164449516 --repo "${{ github.repository }}" --name LAtelierDuGoblin_Android_015_Signed_TEST --dir "$RUNNER_TEMP/old-012"
          test -s "$RUNNER_TEMP/old-012/app-release.apk"
      - name: Enable hardware acceleration for signed APK upgrade test
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "::warning::No KVM device; emulator may be slow"
          fi
      - name: Upgrade existing signed 0.1.5 to newly signed 0.1.6 on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-boot-timeout: 720
          script: |
            adb install -r "$RUNNER_TEMP/old-012/app-release.apk"
            adb shell am start -n fr.atelierdugoblin.mobile/.MainActivity
            adb shell am force-stop fr.atelierdugoblin.mobile
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -n fr.atelierdugoblin.mobile/.MainActivity
            sleep 15
            adb shell pidof fr.atelierdugoblin.mobile
            adb logcat -d -s AndroidRuntime:E | tee /tmp/signed-upgrade-crashes.log
            ! grep -q 'FATAL EXCEPTION' /tmp/signed-upgrade-crashes.log
      - name: Archive verified signed APK for review (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: LAtelierDuGoblin_Android_016_Signed_TEST
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
