name: Windows TEST independent frozen runtime restart
on:
  push:
    branches: [test/restart-runtime-20261116]
permissions:
  contents: read
jobs:
  restart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6.16,<7"
      - run: python tools/release_smoke.py
      - run: python -m unittest discover -s tools -p test_desktop_update_reopen.py
