name: Administrative workflow, local files and recurring actions TEST
on:
  push:
    branches: [test/admin-compact-20261113]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/release_smoke.py
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --only-shell chromium
      - run: node tools/admin_workspace_browser_test.cjs
      - run: node tools/display_preferences_browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Administrative_workspace_synthetic_fixtures
          path: artifacts/
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_admin_*.py'
