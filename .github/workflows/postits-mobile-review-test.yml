name: Desktop interaction repairs Windows TEST
on:
  push:
    branches: [test/desktop-repairs-20261110]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: TZ=Europe/Paris node --test tests/calendar_relative.test.cjs
      - run: python tools/release_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --only-shell chromium
      - run: node tools/life_tools_browser_test.cjs
      - run: node tools/budget_calendar_clarity_browser_test.cjs
      - run: node tools/cycle_compact_browser_test.cjs
      - run: node tools/week_clarity_forecast_browser_test.cjs
      - run: node tools/windows_library_calendar_browser_test.cjs
      - run: node tools/calendar_priority_browser_test.cjs
      - run: node tools/utility_safety_browser_test.cjs
      - run: node tools/tracker_lists_browser_test.cjs
      - run: node tools/tracker_layout_browser_test.cjs
      - run: node tools/tracker_ritual_browser_test.cjs
      - run: node tools/studio_browser_test.cjs
      - run: node tools/desktop_repairs_browser_test.cjs
      - run: node tools/preparations_tracker_home_browser_test.cjs
      - run: python tools/build_windows_test_delivery.py --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: Postits_review_TEST_kit
          path: |
            dist/Goblin_MAJ_Windows_TEST_20261109.zip
            dist/Goblin_MAJ_Windows_TEST_20261109.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Postits_review_browser_evidence
          path: artifacts
          if-no-files-found: ignore
  windows:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.15']
    needs: browser
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      GOBLIN_RUN_ISOLATED_DELIVERY_TEST: '1'
      PYTHONUTF8: '1'
      GOBLIN_NATIVE_POSTIT_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          name: Postits_review_TEST_kit
          path: dist
      - shell: pwsh
        run: Expand-Archive dist/Goblin_MAJ_Windows_TEST_20261109.zip -DestinationPath dist
      - run: python -m unittest discover -s tests -p test_desktop_note_shapes.py -v
      - run: python -m unittest discover -s tests -p test_windows_snapshot_upgrade.py -v
      - run: python -m unittest discover -s tests -p test_windows_delivery_install.py -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Postits_review_windows_${{ matrix.python-version }}_failure
          path: artifacts
          if-no-files-found: ignore
